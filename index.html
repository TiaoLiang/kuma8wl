<!doctype html>

<head>
<meta charset="utf-8">

<title>熊八的武林</title>
<meta name="description" content="一百二十公斤的上班族熊八，穿越到武俠世界坐垮了盟主寶座！武俠卡牌 RPG：連招相剋、七大門派、二十位夥伴、輪迴二週目。免費線上遊玩。">
<meta property="og:type" content="website">
<meta property="og:title" content="熊八的武林｜武俠卡牌 RPG">
<meta property="og:description" content="從坐椅賊到武林至尊！七大門派、二十位夥伴、五卷劇情、輪迴二週目，打開網頁就能玩。">
<meta property="og:image" content="https://tiaoliang.github.io/kuma8wl/cover.png">
<meta property="og:url" content="https://tiaoliang.github.io/kuma8wl/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= 主題色（SVG 用）：雙色平塗 ================= */
.theme{
  --sky:#f3ead3; --sun:#c8402e; --mt1:#d4c8ab; --mt2:#a99d82; --mt3:#6f6553; --ground:#e2d3ae; --groundD:#c4b083;
  --skin:#f7d2b1; --skinD:#e2a582; --cheek:#f29b8b; --pale:#dfe9cf; --paleD:#b9cba4;
  --hair:#2a2420; --grey:#d9d9d4; --greyD:#a9aaa3;
  --robeS:#e8a33a; --robeSD:#b9741c; --robeG:#a8875a; --robeGD:#7a5c36; --robeW:#8ea2b4; --robeWD:#5f7488; --robeT:#3f5e48; --robeTD:#26392c; --robeK:#6a4f8f; --robeKD:#45325f; --robeE:#eef2f4; --robeED:#b4c3d0; --trim:#4f7fa6;
  --sash:#a83a2a; --sashD:#6f2116; --gold:#e3b341; --goldD:#b18522;
  --bandit:#9b6b45; --banditD:#6a4327; --blue:#3f6283; --blueD:#273f57;
  --poison:#6f9d58; --poisonD:#466c35; --purple:#5d3f7c; --purpleD:#3a2654;
  --jade:#8fd6b0; --jadeD:#58a982; --miao:#fff4e4; --miaoD:#efcdac; --wing:#e2f2ff; --wingD:#a8cde8;
  --white:#fffdf7; --steel:#d6dde3; --steelD:#8e9aa4; --wood:#b07a42; --woodD:#74491f;
  --bamboo:#93b86f; --bambooD:#5c8642; --leaf:#4f7a3a; --roof:#3b3532; --wall:#efe4c8; --wallD:#cdbb92;
  --shadow:rgba(0,0,0,.16); --mist:rgba(255,255,255,.55);
}
/* ================= 黑白網點 ================= */
.theme.mono{
  --sky:#fff; --sun:#fff; --mt1:url(#toneL); --mt2:url(#toneM); --mt3:url(#toneD); --ground:#fff; --groundD:url(#toneL);
  --skin:#fff; --skinD:url(#toneL); --cheek:url(#toneL); --pale:#fff; --paleD:url(#toneL);
  --hair:#111; --grey:#fff; --greyD:url(#toneL);
  --robeS:url(#toneL); --robeSD:url(#toneM); --robeG:url(#toneL); --robeGD:url(#toneM); --robeW:url(#toneL); --robeWD:url(#toneM); --robeT:url(#toneM); --robeTD:url(#toneD); --robeK:url(#toneM); --robeKD:url(#toneD); --robeE:#fff; --robeED:url(#toneL); --trim:url(#toneD);
  --sash:url(#toneD); --sashD:#111; --gold:url(#toneL); --goldD:url(#toneM);
  --bandit:url(#toneM); --banditD:url(#toneD); --blue:url(#toneM); --blueD:url(#toneD);
  --poison:url(#toneM); --poisonD:url(#toneD); --purple:url(#toneD); --purpleD:#111;
  --jade:url(#toneL); --jadeD:url(#toneM); --miao:#fff; --miaoD:url(#toneL); --wing:#fff; --wingD:url(#toneL);
  --white:#fff; --steel:#fff; --steelD:url(#toneL); --wood:url(#toneL); --woodD:url(#toneM);
  --bamboo:url(#toneL); --bambooD:url(#toneM); --leaf:url(#toneD); --roof:#111; --wall:#fff; --wallD:url(#toneL);
  --shadow:url(#toneL); --mist:rgba(255,255,255,.7);
}
.sky{fill:var(--sky)} .sunC{fill:var(--sun)} .mt1{fill:var(--mt1)} .mt2{fill:var(--mt2)} .mt3{fill:var(--mt3)}
.ground{fill:var(--ground)} .groundD{fill:var(--groundD)}
.skin{fill:var(--skin)} .skinD{fill:var(--skinD)} .cheek{fill:var(--cheek)} .pale{fill:var(--pale)} .paleD{fill:var(--paleD)}
.hair{fill:var(--hair)} .grey{fill:var(--grey)} .greyD{fill:var(--greyD)}
.robeW{fill:var(--robeW)} .robeWD{fill:var(--robeWD)} .robeT{fill:var(--robeT)} .robeTD{fill:var(--robeTD)} .robeK{fill:var(--robeK)} .robeKD{fill:var(--robeKD)} .robeG{fill:var(--robeG)} .robeGD{fill:var(--robeGD)} .robeS{fill:var(--robeS)} .robeSD{fill:var(--robeSD)} .robeE{fill:var(--robeE)} .robeED{fill:var(--robeED)} .trim{fill:var(--trim)}
.sash{fill:var(--sash)} .sashD{fill:var(--sashD)} .gold{fill:var(--gold)} .goldD{fill:var(--goldD)}
.bandit{fill:var(--bandit)} .banditD{fill:var(--banditD)} .blue{fill:var(--blue)} .blueD{fill:var(--blueD)}
.poison{fill:var(--poison)} .poisonD{fill:var(--poisonD)} .purple{fill:var(--purple)} .purpleD{fill:var(--purpleD)}
.jade{fill:var(--jade)} .jadeD{fill:var(--jadeD)} .miao{fill:var(--miao)} .miaoD{fill:var(--miaoD)} .wing{fill:var(--wing)} .wingD{fill:var(--wingD)}
.white{fill:var(--white)} .steel{fill:var(--steel)} .steelD{fill:var(--steelD)} .wood{fill:var(--wood)} .woodD{fill:var(--woodD)}
.bamboo{fill:var(--bamboo)} .bambooD{fill:var(--bambooD)} .leaf{fill:var(--leaf)} .roof{fill:var(--roof)} .wall{fill:var(--wall)} .wallD{fill:var(--wallD)}
.shd{fill:var(--shadow)} .mist{fill:var(--mist)} .ink{fill:#111} .nofill{fill:none}

/* ================= 線條規則 ================= */
.art{stroke:#111;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ns,.ns *{stroke:none}
.thin{stroke-width:1.6;fill:none}
.hl{stroke-width:1.1;fill:none}
.wl{stroke:#fff;stroke-width:1.2;fill:none;opacity:.75}

/* ================= 動畫 ================= */
.art .body,.art .head,.art .armL,.art .armR,.art .floaty,.art .wingL,.art .wingR,.art .wisp{transform-box:fill-box}
.idle .body{animation:breathe calc(1.8s * var(--spd,1)) ease-in-out infinite;transform-origin:50% 100%}
.idle .head{animation:bob calc(1.8s * var(--spd,1)) ease-in-out infinite;transform-origin:50% 100%}
.float{animation:floaty 2.6s ease-in-out infinite}
.art .wingL{animation:flapL .5s ease-in-out infinite;transform-origin:100% 80%}
.art .wingR{animation:flapR .5s ease-in-out infinite;transform-origin:0% 80%}
.art .wisp{animation:wisp 2.2s ease-in-out infinite;transform-origin:50% 0%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.8px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
@keyframes wisp{0%,100%{transform:skewX(0)}50%{transform:skewX(8deg)}}
@media (prefers-reduced-motion:reduce){.art *,.float{animation:none!important}}

/* ================= UI 主題 ================= */
:root{
  --ui-bg:#1d1916; --ui-panel:#211c18; --ui-text:#f3ead6; --ui-dim:#b9ac92; --ui-line:#f3ead6; --ui-accent:#e3b341; --ui-red:#c8402e;
  --ui-radius:6px; --ui-border:3px; --ui-btn-minh:44px; --ui-font:'LXGW WenKai TC','Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  --card-bg:#f4ead2; --card-ink:#1a1612; --cAtk:#c8402e; --cDef:#2f8f9d; --cMind:#c99a1d; --cItem:#7d7468; --cCurse:#2a2a2a;
  --cw:clamp(84px,min(27vw,16vh),126px);
}
.mono{ --card-bg:#fff; --cAtk:#111; --cDef:#555; --cMind:#888; --cItem:#aaa; --ui-red:#111; --ui-accent:#fff }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:var(--ui-font);overflow:hidden}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;max-width:1280px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);margin:0 auto;overflow:hidden;background:#2a241f}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{min-height:var(--ui-btn-minh);padding:8px 18px;border:var(--ui-border) solid var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-panel);color:var(--ui-text);font-size:17px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;letter-spacing:.06em}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--ui-red);border-color:#111;color:#fff}
.btn.gold{background:var(--ui-accent);border-color:#111;color:#111}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.topbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:40}
#app:has(#battle.on) .topbar{display:none}
.mono .btn.red{background:#111;color:#fff;border-color:#fff}

/* 標題 */
#title{align-items:center;justify-content:center;background:var(--card-bg);color:#1a1612;overflow:hidden}
#title .bgArt{position:absolute;inset:0}
#title .bgArt svg{width:100%;height:100%}
.ttl{position:relative;text-align:center;z-index:2;margin-top:-6vh}
.ttl h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(48px,13vw,92px);margin:0;letter-spacing:.08em;color:#111;text-shadow:3px 3px 0 #e3b341}
.mono .ttl h1{text-shadow:3px 3px 0 #bbb}
.ttl .sub{font-size:clamp(14px,3.6vw,19px);margin:4px 0 0;color:#3a2f25}
.ttl .heroes{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:8px 0 12px}
.ttl .heroes svg{width:clamp(80px,22vw,130px);height:auto;overflow:visible}
.ttl .heroes .big{width:clamp(130px,36vw,210px)}
.ttl .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.ttl .ver{margin-top:14px;font-size:13px;color:#6a5a48}
.seal{display:inline-flex;align-items:center;justify-content:center;background:#c8402e;color:#fff;border:2px solid #111;border-radius:4px;font-weight:900;font-family:'Noto Serif TC',serif}
.mono .seal{background:#111}

/* 選門派 */
#select{background:#241f1b;overflow-y:auto}
#select h2,.panelTitle{text-align:center;font-family:'Noto Serif TC',serif;font-size:24px;margin:16px 0 4px;letter-spacing:.1em}
.hint{text-align:center;color:var(--ui-dim);font-size:14px;margin:0 12px 10px}
.sects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:8px 16px 24px}
.sect{position:relative;background:var(--card-bg);color:#1a1612;border:3px solid #111;border-radius:8px;box-shadow:4px 4px 0 #000;padding:8px 10px 10px;cursor:pointer;text-align:center}
.sect svg{width:100%;max-width:130px;height:auto}
.sect h3{margin:2px 0;font-family:'Noto Serif TC',serif;font-size:22px}
.sect .role{font-size:13px;color:#7a2a1c;font-weight:700}
.mono .sect .role{color:#111}
.sect p{font-size:13px;line-height:1.5;margin:6px 0 0;text-align:left}
.sect.lock{filter:grayscale(1);opacity:.55;cursor:default}
.sect .lockTag{position:absolute;top:10px;right:-6px;transform:rotate(8deg);padding:2px 8px;font-size:13px}
.sect .stars{color:#c8402e;font-size:13px}

/* 對話 */
#talk{position:absolute;inset:0;z-index:60;display:none;cursor:pointer}
#talk.on{display:block}
#talk .bgFx{position:absolute;inset:0;opacity:0;transition:opacity .25s;pointer-events:none}
#talk .bgFx.on{opacity:1}
#talk .bgFx svg{width:100%;height:100%}
.tbox{position:absolute;left:10px;right:10px;bottom:10px;min-height:140px;background:var(--ui-panel);border:var(--ui-border) solid var(--ui-line);border-radius:var(--ui-radius);box-shadow:4px 4px 0 #000;padding:14px 14px 14px 128px;max-width:900px;margin:0 auto}
.tbox .por{position:absolute;left:8px;bottom:8px;width:112px;height:112px;background:var(--card-bg);border:3px solid #111;border-radius:6px;overflow:hidden}
.tbox .por svg{width:100%;height:100%}
.tbox .por .noPor{display:flex;align-items:center;justify-content:center;height:100%;font-size:44px;color:#111;font-family:'Noto Serif TC',serif;font-weight:900}
.tbox .nm{position:absolute;top:-17px;left:128px;padding:2px 12px;font-size:16px}
.tbox .tx{font-size:clamp(16px,4.3vw,20px);line-height:1.6;white-space:pre-wrap}
.tbox .nx{position:absolute;right:12px;bottom:6px;font-size:13px;color:var(--ui-dim);animation:blink 1s infinite}
.tbox .skip{position:absolute;right:8px;top:-36px}
@keyframes blink{50%{opacity:.2}}
.narr .tbox{padding-left:16px}.narr .tbox .por,.narr .tbox .nm{display:none}

/* 地圖 */
#map{background:var(--card-bg);color:#1a1612}
#map .mapSvg{flex:1;position:relative}
#map .mapSvg svg{position:absolute;inset:0;width:100%;height:100%}
.mapHud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--ui-panel);color:var(--ui-text);border-top:3px solid #111}
.mapHud .grow{flex:1}
.node{cursor:pointer}
.node.next .ring{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
.hpPill{font-weight:700}

/* 戰鬥 */
#battle{background:#2a241f}
#stage{position:relative;--sh:clamp(250px,50vh,460px);height:var(--sh);overflow:hidden;border-bottom:3px solid #111}
#stage .bg{position:absolute;inset:0}
#stage .bg svg{width:100%;height:100%}
.fighters{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 2% 64px}
.pbox{position:relative;display:flex;flex-direction:column;align-items:center}
.pbox svg{width:min(33vw,calc(var(--sh) * .56));height:auto;overflow:visible;display:block}
.ebox-wrap{display:flex;align-items:flex-end;justify-content:flex-end;gap:2%;flex:1;min-width:0;margin-left:2%}
.ebox{position:relative;display:flex;flex-direction:column;align-items:center;flex:0 1 auto;min-width:0;cursor:pointer;transition:opacity .4s, transform .2s}
.ebox.boss{flex:0 1 auto}
.ebox svg.fig{width:min(28vw,calc(var(--sh) * .52));max-width:100%;height:auto;overflow:visible;display:block;margin:0 auto}
.ebox-wrap.solo .ebox svg.fig{width:min(36vw,calc(var(--sh) * .56))}
.ebox.boss svg.fig,.ebox-wrap.solo .ebox.boss svg.fig{width:min(48vw,calc(var(--sh) * .68))}
.ebox.sel .fig{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px #e3b341)}
.ebox.dead{opacity:0;pointer-events:none}
.ebox .tgt{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);font-size:12px;padding:1px 6px;display:none}
.ebox.sel .tgt{display:block}
.intent{display:flex;gap:3px;align-items:center;background:rgba(20,17,15,.85);color:#fff;border:2px solid #111;border-radius:6px;padding:2px 6px;font-size:13px;font-weight:700;min-height:26px;margin-bottom:2px;white-space:nowrap}
.intent svg{width:16px;height:16px}
.intent .lb{color:#ffd07a;font-size:12px}
.bars{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max(100%,84px);max-width:170px;margin-top:2px}
.hpbar{position:relative;height:13px;background:#3a302a;border:2px solid #111;border-radius:7px;overflow:hidden}
.hpbar i{position:absolute;inset:0;right:auto;background:linear-gradient(#e2584a,#a72e22);transition:width .3s}
.mono .hpbar i{background:#666}
.hpbar.blk i.b{background:none}
.hpbar span{position:absolute;inset:0;font-size:11px;line-height:10px;text-align:center;color:#fff;font-weight:700;text-shadow:1px 1px 0 #000}
.ename{font-size:13px;font-weight:700;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;white-space:nowrap}
.chips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:18px;margin-top:2px}
.chip{font-size:11px;padding:0 5px;border-radius:9px;background:#3b322b;border:1.5px solid #111;color:#fff;line-height:15px;white-space:nowrap}
.chip.bad{background:#7a2a1c}.chip.good{background:#2f6b4a}.chip.blk{background:#2f6f8f}
.mono .chip.bad,.mono .chip.good,.mono .chip.blk{background:#333}
.stance{position:absolute;top:-2px;right:-4px;width:30px;height:30px;border-radius:50%;border:2.5px solid #111;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:900;font-size:17px;color:#fff;box-shadow:2px 2px 0 #000;z-index:3}
.st-剛{background:#c8402e}.st-快{background:#3f6fa8}.st-柔{background:#3f8a5a}.st-奇{background:#7a3f9e}
.mono .stance{background:#fff!important;color:#111}
.brk{display:flex;gap:2px;justify-content:center;margin-top:2px}
.brk b{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid #111;background:#4a3f37}
.brk b.on{background:#e3b341}
.broken .fig{animation:wobble .5s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.lunge{animation:lunge .35s ease}
@keyframes lunge{40%{transform:translateX(-26%) scale(1.06)}}
.plunge{animation:plunge .3s ease}
@keyframes plunge{40%{transform:translateX(22%) scale(1.05)}}
.hitk{animation:hitk .3s}
@keyframes hitk{30%{transform:translateX(6%);filter:brightness(2.5)}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.dmgN{position:absolute;font-family:'Noto Serif TC',serif;font-weight:900;font-size:28px;color:#fff;-webkit-text-stroke:5px #111;paint-order:stroke fill;animation:dmgUp .9s ease-out forwards;white-space:nowrap}
.dmgN.big{font-size:42px;color:#ffd23f}
.dmgN.heal{color:#7fe08f}.dmgN.blk{color:#9ad7ff}.dmgN.me{color:#ff7b6b}
.dmgN.note{font-size:17px;color:#ffd07a;-webkit-text-stroke:4px #111}
@keyframes dmgUp{0%{transform:translate(-50%,0) scale(1.6)}20%{transform:translate(-50%,-6px) scale(1)}100%{transform:translate(-50%,-50px);opacity:0}}
.sfx{position:absolute;width:150px;height:80px;margin:-40px 0 0 -75px;animation:sfxPop .8s ease-out forwards}
@keyframes sfxPop{0%{transform:scale(2.6) rotate(var(--r,-8deg));opacity:0}15%{transform:scale(.9) rotate(var(--r,-8deg));opacity:1}25%{transform:scale(1) rotate(var(--r,-8deg))}80%{opacity:1}100%{transform:scale(1.1) rotate(var(--r,-8deg));opacity:0}}
.lines{position:absolute;inset:0;opacity:.9;animation:fadeOut .45s forwards}
.lines svg{width:100%;height:100%}
@keyframes fadeOut{to{opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(17,14,12,.88);border-top:3px solid #e3b341;border-bottom:3px solid #e3b341;font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;letter-spacing:.3em;color:#fff;animation:bannerIn 1s ease forwards}
.banner.enemy{border-color:#c8402e}
@keyframes bannerIn{0%{transform:scaleY(0)}15%{transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.bigSeal{position:absolute;left:50%;top:44%;width:150px;height:150px;margin:-75px 0 0 -75px;font-size:100px;border-width:5px;border-radius:12px;box-shadow:5px 5px 0 #000;animation:stampIn .5s ease-out forwards}
@keyframes stampIn{0%{transform:scale(3) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.flash{position:absolute;inset:0;box-shadow:inset 0 0 60px 20px rgba(200,40,30,.7);animation:fadeOut .45s forwards}
.ink{}
.blot{position:absolute;border-radius:50%;background:#111;animation:blot .7s ease-out forwards}
@keyframes blot{0%{transform:scale(.1)}30%{transform:scale(1.15)}100%{transform:scale(1);opacity:0}}

/* HUD */

.handArea{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}

/* 卡牌 */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.45);flex:none;background:var(--card-bg);color:var(--card-ink);border:2.5px solid #111;border-radius:7px;box-shadow:3px 3px 0 #000;cursor:pointer;transition:transform .15s, margin .15s;overflow:hidden;user-select:none}

.card .ds{position:absolute;left:4px;right:4px;bottom:16px;top:calc(var(--cw)*.86);font-size:calc(var(--cw) * .104);line-height:1.3;text-align:center;overflow:hidden}

.card .ds b{color:#a82a1c}

.card .tg{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.11);font-weight:900;color:#5a4a3a}
.card .tp{position:absolute;bottom:2px;right:5px;font-size:calc(var(--cw)*.1);color:#7a6a5a}
.flyCard{position:fixed;z-index:80;pointer-events:none;transition:all .26s ease-in}

/* 面板（獎勵、客棧、牌組） */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(17,14,12,.95);display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:14px 10px 24px}

/* 絕學 cut-in */
#cutin{position:absolute;inset:0;z-index:70;display:none;pointer-events:none;overflow:hidden}
#cutin.on{display:block}
#cutin .ci{position:absolute;left:-5%;right:-5%;top:22%;height:44%;background:#111;transform:skewY(-6deg);border-top:5px solid #e3b341;border-bottom:5px solid #e3b341;overflow:hidden;animation:ciIn 1.5s ease forwards}
#cutin .ci .lines{animation:none;opacity:1}

#cutin .word{position:absolute;right:6%;top:18%;font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(34px,9vw,70px);color:#fff;-webkit-text-stroke:3px #c8402e;paint-order:stroke fill;writing-mode:vertical-rl;letter-spacing:.06em;animation:wordIn 1.5s ease forwards;line-height:1.1;max-height:100%}
#cutin .shout{position:absolute;right:30%;bottom:8%;color:#ffd23f;font-weight:900;font-size:clamp(16px,4vw,24px);animation:wordIn 1.5s ease .1s forwards;opacity:0}
@keyframes ciIn{0%{transform:skewY(-6deg) scaleY(0)}12%{transform:skewY(-6deg) scaleY(1)}85%{opacity:1}100%{opacity:0}}
@keyframes faceIn{0%{transform:translateX(-60%)}20%{transform:translateX(0)}100%{transform:translateX(4%)}}
@keyframes wordIn{0%{opacity:0;transform:scale(2)}25%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}

.toast{position:relative;background:#111;border:2px solid #e3b341;border-radius:6px;padding:6px 14px;font-size:15px;animation:fadeOut 1.4s 0.6s forwards}

/* 結局／失敗 */

}

.chainFx span{font-size:52px;margin-right:4px}
.combo small{font-size:11px;color:#d8c9a8;margin-left:4px}
.place{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;background:#f4ead2;border-top:3px solid #111;color:#1a1612;font-size:16px;min-height:52px}

<pattern id="toneD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3.2" height="3.2" fill="#fff"/><circle cx="1.6" cy="1.6" r="1.35" fill="#111"/></pattern>
</defs></svg>`;

/* ================= ART: 熊八（表情表） ================= */
const BEAR_EXPR = {

    <path class="thin" d="M24.5 12.6 l4 -.4 M35.5 12.2 l4 .4"/>`,
  shock:`<circle class="white" cx="27" cy="16" r="3.1"/><circle class="white" cx="37" cy="16" r="3.1"/>

function mangaLinesSVG(n=54, fill='#111', r0=95){
  const cx=200, cy=150, R=460; let s='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2 + Math.random()*.09, w=.01+Math.random()*.028, r1=r0+Math.random()*80;
    const p=(ang,r)=>`${(cx+Math.cos(ang)*r).toFixed(1)},${(cy+Math.sin(ang)*r).toFixed(1)}`;
    s+=`<polygon points="${p(a-w,R)} ${p(a+w,R)} ${p(a,r1)}" fill="${fill}"/>`;
  }
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}
function sfxSVG(text, color='#ffd23f'){
  return `<svg viewBox="0 0 150 80"><text x="75" y="56" text-anchor="middle" fill="${color}" stroke="#111" stroke-width="7" stroke-linejoin="round" paint-order="stroke"
    style="font:900 46px 'Noto Serif TC',serif;letter-spacing:-2px">${text}</text></svg>`;
}

let P = null;   // 玩家（存檔內容）
let B = null;   // 戰鬥
let uidN = 1;

function newRun(sect){
  const S = SECTS[sect];
  P = { v:GAME_VERSION, sect, hp:S.hp, max:S.hp, deck:S.start.map(id=>({id,up:false})), region:'zhongyuan', at:'ring', seen:{ring:1}, cleared:{}, party:[], mastery:{},
        silver:30, fame:0, mates:[], flags:{}, shop:null, lib:[], seenCards:{},
        lv:1, exp:0, pts:0, realm:0, token:5, pity:0, attr:{...S.attr},
        stat:{turns:0,maxHit:0,maxCombo:0,cards:0,breaks:0,ults:0,wins:0,losses:0,dmgTotal:0,dmgTaken:0,pulls:0,silverEarned:0,tourneyRuns:0,tourneyWins:0},
        day:1, infamy:0, titles:[], arena:{}, arenaWins:{}, volDay:{} };
}
function save(){ if(!P) return; try{ P.deck.forEach(c=>P.seenCards[c.id]=1); P.savedAt=Date.now(); P.v=GAME_VERSION; store.set(SAVE_KEY, P);
  const bt=store.get(SAVE_KEY+'-bakT',0); if(P.savedAt-bt>60000){ store.set(SAVE_KEY+'-bak', P); store.set(SAVE_KEY+'-bakT', P.savedAt); }
  if(typeof cloudPush==='function') cloudPush(); }catch(e){} }
function load(){
  for(const k of [SAVE_KEY, SAVE_KEY+'-bak']){
    const s=store.get(k,null); if(!s||!s.sect||!SECTS[s.sect]) continue;
    try{ s.deck=(s.deck||[]).filter(c=>CARDS[c.id]); if(!s.deck.length) s.deck=SECTS[s.sect].start.map(id=>({id,up:false})); s.mates=(s.mates||[]).filter(m=>MATES[m]); migrate(s); return s; }
    catch(e){ console.warn('存檔轉換失敗，改用備份', e); }
  }
  return null;
}
function migrate(s){
  const S=SECTS[s.sect];
  s.flags=s.flags||{}; s.cleared=s.cleared||{}; s.seen=s.seen||{}; s.attr=s.attr||{...S.attr};
  if(!s.at||!NODE[s.at]){ s.region=REGIONS[s.region]?s.region:'zhongyuan'; s.at=REGIONS[s.region].start; }
  s.day=s.day||1; s.infamy=s.infamy||0; s.titles=s.titles||[]; s.arena=s.arena||{}; s.arenaWins=s.arenaWins||{}; s.volDay=s.volDay||{};
  s.stat=Object.assign({turns:0,maxHit:0,maxCombo:0,cards:0,breaks:0,ults:0,wins:0,losses:0,dmgTotal:0,dmgTaken:0,pulls:0,silverEarned:0,tourneyRuns:0,tourneyWins:0}, s.stat||{});
  if(s.party) s.party=s.party.filter(m=>m!=='xiaozong');
  if(s.lv==null){ s.lv=1; s.exp=0; s.pts=0; s.realm=0; s.token=5; s.pity=0; s.attr={...S.attr}; }
  s.region=s.region||(NODE[s.at]&&NODE[s.at].region)||'zhongyuan'; s.mastery=s.mastery||{}; s.party=(s.party||s.mates.slice(0,3)).filter(m=>s.mates.includes(m));
  s.lib=(s.lib||[]).filter(c=>CARDS[c.id]); s.seenCards=s.seenCards||{}; [...s.deck,...s.lib].forEach(c=>s.seenCards[c.id]=1);
  const old=s.max; s.max=calcMax(s); if(old!=null) s.hp=Math.max(1,Math.min(s.max,s.hp+(s.max-old)));
}
/* ================= 等級、屬性、境界 ================= */
const ATTR=[['str','臂力','攻擊卡傷害 +1／點'],['inn','內功','絕學傷害 +8%／點；每 3 點第一回合內力 +1'],['agi','身法','身法卡護體 +1／點'],['con','根骨','最大氣血 +5／點'],['wis','悟性','經驗 +10%／點；老鬼指點便宜 3 兩／點'],['luk','福緣','銀兩 +8%／點；戰利品稀有招式機率 +4%／點']];
const ATTR_N=Object.fromEntries(ATTR.map(a=>[a[0],a[1]]));
const REALMS=[{n:'後天',need:1},{n:'先天',need:6},{n:'宗師',need:16}];
const ax=k=>Math.max(0,(P.attr[k]||1)-1);
function expNeed(lv){ return 14+8*lv; }
function calcMax(s){ const S=SECTS[s.sect]; return S.hp + 5*(s.attr.con-S.attr.con) + 4*(s.lv-1) + (s.realm>=1?10:0) + (s.realm>=2?15:0) + (s.realm>=4?20:0) + eqSumOf(s,'hp') + (s.clan&&s.clan.b&&s.clan.b.mengzhu?20:0); }
function recalc(){ const old=P.max; P.max=calcMax(P); P.hp=Math.max(1,Math.min(P.max,P.hp+(P.max-old))); }
function gainExp(n){
  n=Math.round(n*(1+.1*ax('wis')+.1*((P.clan&&P.clan.b&&P.clan.b.train)||0)+eqSum('exp')/100)); P.exp+=n; toast(`經驗 +${n}`);
  let up=0; while(P.exp>=expNeed(P.lv)){ P.exp-=expNeed(P.lv); P.lv++; P.pts++; P.token+=2; up++; recalc(); }
  if(up){ SFX.win(); toast(`升級！Lv ${P.lv}（屬性點 +${up}，俠緣令 +${2*up}）`); P.flags.pendingLv=1; }
}
async function levelUpFlow(){
  if(!P.flags.pendingLv) return; P.flags.pendingLv=0;
  while(P.pts>0){
    const k = await chooseAttr(); if(k==null) break;
  }
  if(P.lv>=REALMS[1].need && P.realm===0 && !P.flags.realmHint){ P.flags.realmHint=1; await talk([['老鬼','smile','小子，你的內息已經滿了。去客棧「閉關」，打敗心魔，就能突破到先天境界。'],['喵喵','shock','心魔是什麼喵？'],['老鬼','smile','每個人心裡最怕的東西。'],['熊八','shock','……我有不好的預感。']]); }
  if(P.lv>=REALMS[2].need && P.realm===1 && !P.flags.realmHint2){ P.flags.realmHint2=1; await talk([['老鬼','smile','Lv 16 了。去客棧閉關，挑戰第二個心魔，就能突破「宗師」。'],['熊八','shock','第二個？我心裡到底住了幾個老闆？']]); }
  if(P.lv>=REALMS[3].need && P.realm===2 && !P.flags.realmHint3){ P.flags.realmHint3=1; await talk([['老鬼','smile','Lv 26。最後一個心魔在等你——突破「大宗師」。'],['熊八','shock','我有預感，這次是考績。']]); }
  save();
}

let talkQ=Promise.resolve();

function talkRaw(lines){
  return new Promise(res=>{
    if(!lines||!lines.length){ res(); return; }
    const el=$('#talk'); el.classList.add('on'); let i=-1, typing=null, full='';
    const por=el.querySelector('.por'), nm=el.querySelector('.nm'), tx=el.querySelector('.tx'), fx=el.querySelector('.bgFx');
    const next=()=>{
      if(typing){ clearInterval(typing); typing=null; tx.textContent=full; return; }
      i++; if(i>=lines.length){ el.classList.remove('on'); el.onclick=null; fx.classList.remove('on'); res(); return; }
      const [who,expr,text,bg]=lines[i]; full=text;
      el.classList.toggle('narr', !who);
      nm.textContent=who; nm.style.display=who?'':'none';
      por.innerHTML = ST_ART[who] ? ST_ART[who](expr) : `<div class="noPor">${who?who[0]:''}</div>`;
      if(bg==='lines'){ fx.innerHTML=mangaLinesSVG(60,'#111',110); fx.classList.add('on'); } else fx.classList.remove('on');
      tx.textContent=''; let k=0; const pitch={熊八:.8,喵喵:1.6,老鬼:.6,錢有理:1.1,林小滿:1.4,慧能:1.25,鐵牛:.7}[who]||1;
      typing=setInterval(()=>{ k++; tx.textContent=full.slice(0,k); if(k%2) SFX.talk(pitch); if(k>=full.length){clearInterval(typing);typing=null;} }, 26*(window.__FAST||1));
    };
    el.onclick=(ev)=>{ if(ev.target.closest('.skip')){ i=lines.length; if(typing){clearInterval(typing);typing=null;} next(); return; } next(); };
    next();
  });
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const alive = ()=>B.enemies.filter(e=>e.hp>0);

function planIntent(e){
  const D=ENEMY[e.key];
  if(D.ai) e.intent=D.ai(e);
  else { const cyc = e.phase===2 ? D.cyc2 : D.cyc; e.intent=cyc[e.i % cyc.length]; e.i++; }
  if(D.heads){ const L=['剛','快','奇'].slice(0,Math.max(1,e.heads)); e.stance=L[B.turn%L.length]; }
  else if(e.phase===2 && D.swap2) e.stance = D.swap2[B.turn%2];
  else if(D.swap && B.turn>1){ e.stance = D.swap.length===2 ? D.swap[(B.turn-1)%2] : pick(D.swap); }
}

async function startTurn(){

  B.turn++; P.stat.turns++;

  if(P.realm>=3) B.en += 1;

  if(B.nextBlk){ B.blk += B.nextBlk; B.nextBlk=0; }
  if(B.minds.borrow) addRes(B.minds.borrow);
  if(B.minds.poisonAll) alive().forEach(e=>{ e.st.poison+=B.minds.poisonAll; });
  alive().forEach(planIntent);
  drawN(5 + (B.extraDraw||0) + (B.minds.drawMore||0) + (B.turn===1&&P.sect==='k'?2:0), true); B.extraDraw=0;

function drawN(n, silent){

    if(!B.draw.length){ if(!B.disc.length) break; B.draw=shuffle(B.disc); B.disc=[]; }
    B.hand.push(B.draw.pop());
  }
  if(!silent) renderAll();
}
function costOf(inst){ return CARDS[inst.id].cost; }
function canPlay(inst){ return costOf(inst)<=B.en && !B.busy && !B.over; }
function wouldChain(d){ return d.type==='atk' && (d.tag==='c'||d.tag==='f') && B.combo>=1; }

function comboStep(d){
  if(d.type!=='atk' || !d.tag) return {mult:1,chain:false,k:0};
  if(d.tag==='s'){ B.combo=1; SFX.combo(1); return {mult:1,chain:false,k:1}; }
  if(d.tag==='c'){ if(B.combo>=1){ B.combo++; SFX.combo(B.combo); fxChain(B.combo); return {mult:1,chain:true,k:B.combo}; } return {mult:1,chain:false,k:0}; }
  if(d.tag==='f'){ if(B.combo>=1){ B.combo++; const k=B.combo; B.combo=0; const m=k>=4?2:k===3?1.5:1.2;
      P.stat.maxCombo=Math.max(P.stat.maxCombo,k); SFX.combo(k+1);
      if(k>=4){ B.en++; fxNote(null,'行雲流水！內力 +1'); }
      fxCombo(k,m); return {mult:m,chain:true,k}; }
    return {mult:1,chain:false,k:0}; }
  return {mult:1,chain:false,k:0};
}

async function playCard(idx, cardEl){

async function swordQi(){ fxNote(null,'劍氣！'); await sleep(120); hitAll(3,{type:'atk',attr:null,qi:true}); }
function addRes(n){
  const cap={s:5,g:10,w:6,t:5,k:9}[P.sect]; const before=B.res; B.res = cap ? Math.min(cap,B.res+n) : B.res+n;
  if(P.sect==='k' && Math.floor(B.res/3)>Math.floor(before/3)){ const t=curTarget(); if(t){ addSt(t,'vuln',1); fxNote(t,'看破！'); } }
}
function addRage(n){ B.rage=Math.min(10,B.rage+n); }

async function useUlt(){

  B.busy=true; B.rage=0; P.stat.ults++;
  await cutIn();
  B.ultMul=1+.08*ax('inn'); await ULTS[P.sect](); B.ultMul=1;

function stanceMul(attr, st){ if(!attr||!st) return 1; if(BEATS[attr]===st) return ruleStanceMul(1.5); if(BEATS[st]===attr) return .7; return 1; }
function baseBonus(d){ let b=B.st.str + (d.type==='atk'&&!d.ult&&!d.qi?ax('str'):0);
  if(d.id){ b+=mBonus(d); if(P.sect==='w' && d.type==='atk' && !d.noAx) b+=Math.floor(B.res/2); if(B.minds.first && B.atkCount===1 && d.type==='atk') b+=B.minds.first; } if(P.sect==='e' && d.type==='atk' && !d.ult && !d.qi && B.atkCount>=3) b+=2; if(P.sect==='g' && d.type==='atk' && !d.ult && B.hand.length<=2) b+=3; return b; }
function hit(t, base, d){
  if(!t||t.hp<=0) return 0;
  let dmg = base + baseBonus(d) + eqBonus(d);
  if(!d.ult && !d.qi) dmg *= (B.cur.mult||1);
  if(d.ult && d.type==='atk' && B.ultMul) dmg *= B.ultMul;
  const sm = d.qi ? 1 : stanceMul(d.attr, t.stance); dmg *= sm;
  if(B.st.weak>0) dmg *= .75;
  if(t.st.vuln>0) dmg *= 1.5;
  if(t.broken) dmg *= 2;
  if(P.sect==='t' && (t.st.poison||0)>=5 && !d.qi) dmg *= 1.25;
  dmg = Math.max(0, Math.floor(dmg));
  dmgEnemy(t, dmg, d.attr, sm);
  if(sm>1 && t.hp>0) addBrk(t,1);
  if(sm<1) fxNote(t,'被剋');
  return dmg;
}
/* 出牌前預估傷害（與 hit 同公式，不產生效果） */
function previewDmg(d, n, t){
  if(d.type!=='atk'||!t) return null;
  const ch = wouldChain(d);
  let base = d.pv ? d.pv(n,ch) : (n.d!=null ? n.d : null); if(base==null) return null;
  let b = B.st.str + ax('str') + mBonus(d) + (P.sect==='w'&&!d.noAx?Math.floor(B.res/2):0) + (B.minds.first&&B.atkCount===0?B.minds.first:0); if(P.sect==='e' && B.atkCount+1>=3) b+=2; if(P.sect==='g' && B.hand.length-1<=2) b+=3;
  let dmg = base + b + eqBonus(d,true);
  if(d.tag==='f' && B.combo>=1){ const k=B.combo+1; dmg *= k>=4?2:k===3?1.5:1.2; }
  dmg *= stanceMul(d.attr, t.stance); if(B.st.weak>0) dmg*=.75; if(t.st.vuln>0) dmg*=1.5; if(t.broken) dmg*=2;
  const x = d.pvx ? d.pvx(ch) : 1;
  return Math.floor(dmg) + (x>1?`×${x}`:'');
}
function hitAll(base,d){ alive().forEach(e=>hit(e,base,d)); }
function addBrk(t,n){
  if(t.broken||t.hp<=0) return; t.brk+=n; fxSeal(t,'破');
  if(t.brk>=t.brkMax){ t.brk=0; t.broken=true; t.stunNext=true; P.stat.breaks++; fxNote(t,'架勢崩潰！'); fxLines(); SFX.heavy();
    if(ENEMY[t.key].heads && t.heads>1){ t.heads--; t.st.vuln+=2; fxNote(t,'斬落一首！'); const f=document.querySelector(`.ebox[data-u="${t.uid}"] .fig`); if(f) f.innerHTML=t.art('hurt',t); } }
}
function dmgEnemy(t,dmg,attr,sm){
  if(dmg>0){ t.hitT=B.turn; B.kpiDmg=(B.kpiDmg||0)+dmg; P.stat.dmgTotal=(P.stat.dmgTotal||0)+dmg; }
  const b=Math.min(t.blk,dmg); t.blk-=b; const hp=dmg-b; t.hp=Math.max(0,t.hp-hp);
  P.stat.maxHit=Math.max(P.stat.maxHit,dmg);
  const el=document.querySelector(`.ebox[data-u="${t.uid}"]`);
  if(el) bump(el.querySelector('.fig'),'hitk');
  fxNum(el, b&&!hp ? `擋 ${b}` : hp, dmg>=15?'big':'', b&&!hp?'blk':'');
  const word={剛:'砰！',快:'咻！',柔:'啪！',奇:'嗤！'}[attr]||'鏘！';
  if(dmg>=15){ fxSfx(el, '轟！', '#ffd23f'); fxLines(); shake(); SFX.heavy(); }
  else { fxSfx(el, word, {剛:'#ff7a5a',快:'#9fd0ff',柔:'#9fe3b0',奇:'#d8a8ff'}[attr]||'#fff'); attr==='快'?SFX.slash():SFX.hit(); }
  if(t.hp<=0){ fxBlot(el); el && setTimeout(()=>el.classList.add('dead'),420); }
  renderEnemies();
}
function gainBlk(n, quiet){ if(B.cardType==='def'){ n+=ax('agi'); if(B.curCard) n+=mBonus(B.curCard); } B.blk+=n; if(!quiet){ fxNum($('#pFig'), `+${n}`, '', 'blk'); SFX.block(); } renderHud(); }
function heal(n){ const h=Math.min(n,P.max-P.hp); P.hp+=h; fxNum($('#pFig'), `+${h}`, '', 'heal'); SFX.buff(); renderHud(); }
function addSt(t,k,v){ if(!t||t.hp<=0) return; t.st[k]=(t.st[k]||0)+v; renderEnemies(); }
function note(t,txt){ fxNote(t,txt); }
function bump(el,cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

async function afterAction(){
  for(const e of B.enemies){
    const D=ENEMY[e.key];
    if(D.half && e.phase===1 && e.hp>0 && e.hp<=e.max/2){
      e.phase=2; e.i=0; e.st.str+=2; e.stance=D.swap2[0]; e.brk=0;
      await sleep(300); await talk(SCRIPT[D.half]); planIntent(e); renderAll();
    }
  }
  if(truceCheck()){ fxNote(null,'停戰！'); await winBattle(); return; }
  if(!alive().length) await winBattle();
}

async function mateTurn(){
  for(const id of P.party){
    if(B.over||!alive().length) return;
    const M=MATES[id], el=document.querySelector(`#mates [data-m="${id}"]`);
    bump(el,'plunge'); await sleep(200);
    if(rnd()<.25) fxNote(null, `${M.name}：${pick(M.quips)}`);
    if(MATE_ACT[id]) await MATE_ACT[id]();
    await sleep(260);
  }
  await afterAction();
}

async function endTurn(){
  if(B.busy||B.over) return; B.busy=true; renderAll();
  const lazy=B.hand.filter(c=>c.id==='lzz').length; if(lazy){ B.enPenalty=(B.enPenalty||0)+lazy; fxNote(null,'賴床……下回合內力 −'+lazy); }
  const tickets=B.hand.filter(c=>c.id==='fd').length;
  if(tickets){ for(let k=0;k<tickets;k++){ fxNote(null,'罰單逾期！'); await hurtPlayer(3,null); await sleep(200);} }
  B.disc.push(...B.hand); B.hand=[]; renderAll();
  if(B.st.poison>0){ await hurtPlayer(B.st.poison,null,true); B.st.poison--; }
  if(P.hp<=0) return loseBattle();
  if(P.party.length && B.o.rule!=='nomates'){ await mateTurn(); if(B.over) return; }
  await sleep(200); banner('敵方出招', true); await sleep(650);
  B.firstHit=false;
  for(const e of [...B.enemies]){
    if(e.hp<=0) continue;
    if(e.st.poison>0){ dmgEnemy(e,e.st.poison,null,1); fxNote(e,'中毒'); e.st.poison--; await sleep(300); if(e.hp<=0) continue; }
    if(P.sect==='t' && B.res>0){ B.res--; fxNote(e,'機關觸發！'); dmgEnemy(e,4,'奇',1); addSt(e,'poison',1); await sleep(250); if(e.hp<=0) continue; }
    e.blk=0;
    if(e.stunNext){ e.stunNext=false; e.broken=false; fxNote(e, '動彈不得'); renderEnemies(); await sleep(500); continue; }
    await doIntent(e); if(B.over) return; await sleep(260);
    if(P.hp<=0) return loseBattle();
  }
  ['weak','vuln'].forEach(k=>{ if(B.st[k]>0) B.st[k]--; B.enemies.forEach(e=>{ if(e.st[k]>0) e.st[k]--; }); });
  if(!alive().length){ await winBattle(); return; }
  // 考驗：撐過指定回合
  const T=B.o.test && ENEMY[B.enemies[0].key].test;
  if(T && B.turn>=T){ fxNote(null,'撐過考驗！'); await winBattle(); return; }
  B.busy=false; startTurn();
}

async function doIntent(e){
  const I=e.intent||{}; const el=document.querySelector(`.ebox[data-u="${e.uid}"]`);
  if(I.lb) fxNote(e, I.lb);
  if(I.str){ e.st.str+=I.str; SFX.buff(); }
  if(ENEMY[e.key].kpi && e.hitT!==B.turn){ e.st.str+=3; fxNote(e,'考核未受傷：氣勢 +3'); }
  if(I.tide){ if(B.blk){ fxNote(null,'浪潮沖走了護體！'); B.blk=0; } SFX.bad(); }
  if(I.blk){ e.blk+=I.blk; SFX.block(); fxNum(el,`+${I.blk}`,'','blk'); }
  if(I.heal){ const h=Math.min(I.heal,e.max-e.hp); e.hp+=h; fxNum(el,`+${h}`,'','heal'); }
  if(I.summon){ if(alive().length<3){ const ne=mkEnemy(I.summon,B.enemies.length); B.enemies.push(ne); planIntent(ne); ne.intent={atk:4}; renderEnemies(true); fxNote(ne,'來了！'); SFX.drum(); } else { e.st.str+=2; fxNote(e,'小弟太多了，氣勢 +2'); } }
  renderEnemies();
  if(I.atk){
    for(let k=0;k<(I.n||1);k++){
      if(el) bump(el,'lunge');
      await sleep(170);
      let d=eAtk(I,e); if(e.st.weak>0) d*=.75; if(B.st.vuln>0) d*=1.5; d=Math.floor(d);
      await hurtPlayer(d,e);
      if(P.hp<=0||B.over) return;
      await sleep(200);
    }
  }
  if(I.poison){ B.st.poison+=I.poison; fxNote(null,`中毒 ${I.poison}`); SFX.bad(); }
  if(I.weak){ B.st.weak+=I.weak; fxNote(null,`虛弱 ${I.weak}`); SFX.bad(); }
  if(I.curse){ for(let k=0;k<I.curse;k++) B.disc.push({id:'lzz',up:false,uid:uidN++}); fxNote(null,'塞進「賴床」'); SFX.bad(); }
  if(I.ticket){ for(let k=0;k<I.ticket;k++) B.disc.push({id:'fd',up:false,uid:uidN++}); fxNote(null,`收到罰單 ×${I.ticket}`); SFX.bad(); }
  intentExtra(I);
  renderAll();
}
async function hurtPlayer(d,src,poison){
  if(src && src.tucao){ const p=src.tucao; src.tucao=0; if(rnd()<p){ fxNote(null,'被吐槽到打歪了！'); fxSfx($('#pFig'),'咦？','#fff'); return; } }
  let nt='';
  if(src && P.sect==='w') addRes(1);
  if(src && P.sect==='s' && !B.firstHit){ B.firstHit=true; if(d>0){ d=Math.max(0,d-3); nt='金剛不壞'; } }
  if(src && B.dodge){ B.dodge=0; fxNote(null,'醉步閃過！'); fxSfx($('#pFig'),'閃！','#9fd0ff'); renderHud(); return; }
  if(src && B.minds.armor) d=Math.max(0,d-B.minds.armor);
  if(src){ const r=eqSum('red'); if(r) d=Math.max(0,d-r); }
  const b = poison ? 0 : Math.min(B.blk,d); B.blk-=b; const hp=d-b; P.stat.dmgTaken=(P.stat.dmgTaken||0)+hp;
  if(B.o.test){ P.hp=Math.max(1,P.hp-hp); if(P.hp<=1) B.testFail=true; } else P.hp=Math.max(0,P.hp-hp);
  const pf=$('#pFig');
  if(hp>0){ addRage(1); bump(pf,'hitk'); flash(); SFX.hurt(); shake(); setPlayerExpr('hurt'); fxNum(pf, hp, hp>=15?'big':'', 'me'); }
  else { SFX.block(); fxNum(pf, `擋 ${b}`, '', 'blk'); fxSfx(pf,'鏘！','#9fd0ff'); }
  if(nt) fxNote(null,nt);
  if(src && B.thorns>0 && src.hp>0){ await sleep(120); fxNote(src,'反震！'); dmgEnemy(src,B.thorns,'剛',1); }
  renderHud();
  if(B.testFail){ B.testFail=false; await loseBattle(); }
}
let exprT=null;
function setPlayerExpr(x){ $('#pFig').innerHTML=`<svg viewBox="0 -6 64 70">${bearSVG(P.sect,x)}</svg>`; clearTimeout(exprT); exprT=setTimeout(()=>{ if(B&&!B.over) $('#pFig').innerHTML=`<svg viewBox="0 -6 64 70">${bearSVG(P.sect,'serious')}</svg>`; },700); }

async function winBattle(){
  if(B.over) return; B.over=true; B.busy=true;
  await sleep(500); fxBigSeal('勝'); SFX.win(); setPlayerExpr('happy'); await sleep(1100);
  P.stat.wins++; masteryCheck();
  const n=B.node, o=B.o;
  const ex = (o.demon||o.demon2||o.demon3)?60 : o.arena||o.dispute?10 : o.arenaMain?40 : o.test?15 : n.type==='boss'?50 : o.dungeon?12 : n.type==='elite'?25 : 6+3*B.enemies.length;
  gainExp(P.cleared[n.id]&&!o.dungeon&&!o.test&&!o.demon ? Math.ceil(ex/2) : ex);
  if(!P.cleared[n.id] && !o.test && !o.demon && !o.demon2 && !o.demon3 && !o.arena && !o.dispute && !o.arenaMain && !o.bounty && !o.mj && n.type!=='town'){ const tk = n.type==='boss'?5 : n.type==='elite'?3 : 1; P.token+=tk; toast(`俠緣令 +${tk}`); }
  if(o.demon){ P.realm=1; recalc(); P.hp=P.max; await talk([['','','鬧鐘碎成一地零件。'],['熊八','fire','我……再也不怕週一了！','lines'],['老鬼','smile','好！先天境界，成了！'],['喵喵','happy','突破先天喵！最大氣血 +10、每場戰鬥第一回合內力 +1！']]); P.flags.pendingLv=1; save(); await levelUpFlow(); toMap(); return; }
  if(P.sect==='g'){ P.hp=Math.min(P.max,P.hp+5); }
  if(P.clan && P.clan.b.kitchen) P.hp=Math.min(P.max,P.hp+4*P.clan.b.kitchen);
  if(P.party.includes('biaobiao')) addSilver(10);
  if(await winBattleX(n,o)) return;
  // 拜師考驗
  if(o.test==='shaolin'){ await talk(SCRIPT.shaolinWin); learn('sly');learn('sch'); P.cleared.shaolin=1; gainFame(1);
    if(!P.mates.includes('huineng')){ await talk(SCRIPT.shaolinHui); addMate('huineng'); } toMap(); return; }
  if(o.test==='lake'){ await talk(SCRIPT.lakeWin); learn('cxz');learn('tch'); P.cleared.jn_lake=1; gainFame(1); toMap(); return; }
  if(o.test==='chess'){ await talk(SCRIPT.chessWin); learn('qpj');learn('lzwh'); P.cleared.shu_qing=1; gainFame(1); toMap(); return; }
  if(o.escort){ await talk(SCRIPT.escortWin); P.cleared.jn_escort=1; addSilver(60); gainFame(1); if(!P.mates.includes('biaobiao')){ await talk(SCRIPT.biaobiao); addMate('biaobiao'); } toMap(); return; }
  if(o.test==='drunk'){ await talk(SCRIPT.drunkWin); learn('zq');learn('zb'); P.flags.drunkDone=1; gainFame(1); if(!P.mates.includes('dusanbei')){ await talk(SCRIPT.dusanbei); addMate('dusanbei'); } toMap(); return; }
  if(n.type==='boss'){
    P.cleared[n.id]=1; addSilver(n.id==='wanjie'?50:120); gainFame(3);
    if(n.id==='wanjie'){ P.flags.vol1=1; save(); await talk(SCRIPT.bossWin); showEnd(1); return; }
    if(n.id==='jn_fort'){ P.flags.jnBoss=1;
      const cand=P.party.length?P.party:P.mates;
      if(cand.length){ const m=pick(cand); P.kidnapped=m; P.mates=P.mates.filter(x=>x!==m); P.party=P.party.filter(x=>x!==m);
        await talk(SCRIPT.kidnap.map(l=>l.map(x=>typeof x==='string'?x.replace(/\{mate\}/g,MATES[m].name):x))); }
      else await talk(SCRIPT.kidnapNone);
      save(); showReward(true); return; }
    if(n.id==='shu_wj'){ P.flags.vol2=1;
      if(P.kidnapped){ const m=P.kidnapped; P.kidnapped=null; await talk(SCRIPT.rescue.map(l=>l.map(x=>typeof x==='string'?x.replace(/\{mate\}/g,MATES[m].name):x))); addMate(m); }
      save(); await talk(SCRIPT.jiaoWin); showEnd(2); return; }
  }
  // 秘境
  if(o.dungeon){
    P.dg.stage++;
    if(P.dg.stage < n.stages.length){
      const k = await choose(`古墓第 ${P.dg.stage} 層已清空（氣血 ${P.hp}/${P.max}）`, ['繼續深入（回復 8 氣血）','撤退回地圖']);
      if(k===0){ P.hp=Math.min(P.max,P.hp+8); startBattle(n,{enc:n.stages[P.dg.stage], dungeon:true}); return; }
      P.dg=null; toMap(); return;
    }
    P.dg=null; await talk(SCRIPT.tombWin);
    const first=!P.cleared[n.id]; P.cleared[n.id]=1; addSilver(first?60:30); if(first) gainFame(2);
    await showCardPick(rewardPool().filter(c=>c.r===2), '古墓秘笈', '守墓人守了三百年的秘笈喵！');
    return;
  }
  // 一般／精英
  const first=!P.cleared[n.id];
  P.cleared[n.id]=1;
  addSilver(n.type==='elite' ? 40 : ri(10,16));
  if(first) gainFame(n.type==='elite'?2:1);
  P.shop=null;
  // 本門夥伴第一場勝利後加入
  const sm=SECTS[P.sect].mate;
  if(!P.flags.sectMate){ P.flags.sectMate=1; await talk(SCRIPT['join_'+sm]); addMate(sm); }
  showReward(n.type==='elite');
}
function addSilver(n){ n=Math.round(n*(1+.08*ax('luk')+eqSum('gold')/100)); P.silver+=n; P.stat.silverEarned=(P.stat.silverEarned||0)+n; SFX.coin(); toast(`銀兩 +${n}`); }
async function loseBattle(){
  if(B.over) return; B.over=true; B.busy=true;
  await sleep(400); fxBigSeal('敗'); SFX.lose(); await sleep(1200);
  P.stat.losses=(P.stat.losses||0)+1; P.party=P.party.filter(m=>m!=='xiaozong');
  if(B.o.arena){ P.hp=Math.max(P.hp, Math.ceil(P.max*.3)); await arenaEnd(false); return; }
  if(B.o.dispute){ P.hp=Math.max(P.hp, Math.ceil(P.max*.3)); P.pendingDispute=null; await talk([['門派代表','','盟主……就這點本事？'],['喵喵','sad','紛爭還沒解決，練強一點再去議事廳喵。']]); toMap(); return; }
  if(B.o.arenaMain) P.tx=0;
  if(B.o.test){ P.hp=Math.max(P.hp, Math.ceil(P.max*.3)); await talk(SCRIPT.testLose); toMap(); return; }
  await talk(SCRIPT.lose);
  P.silver=Math.floor(P.silver*.8); P.hp=Math.ceil(P.max*.5); P.at=REGIONS[P.region].start; P.dg=null; save();
  $('#over').innerHTML = `<div class="panelTitle">敗北</div><div class="endBox"><svg viewBox="0 -6 64 70" style="width:120px">${bearSVG(P.sect,'hurt','')}</svg>
    <p>被抬回${NODE[REGIONS[P.region].start].name}的客棧。損失兩成銀兩，氣血回復一半。</p><div class="choice"><button class="btn red" id="retry">站起來，繼續</button></div></div>`;
  $('#over').classList.add('on');
  $('#retry').onclick=()=>{ $('#over').classList.remove('on'); toMap(); };
}

/* ================= 獎勵／客棧／市集／牌組 ================= */
function rewardPool(){ return Object.values(CARDS).filter(c=>c.type!=='curse' && c.r>0 && c.r<=2 && (!c.sect||c.sect===P.sect)); }
function rollCards(nm, rareP){
  rareP+=.04*ax('luk'); const pool=rewardPool(), picks=[];
  let guard=0; while(picks.length<nm && guard++<200){ const r2=rnd()<rareP; const cand=pool.filter(c=>(c.r===2)===r2 && !picks.includes(c)); if(!cand.length) continue; picks.push(pick(cand)); }
  return picks;
}
function showReward(elite){ const lib=(P.clan&&P.clan.b&&P.clan.b.lib)||0; showCardPick(rollCards(3+(lib?1:0), (elite?.6:.3)+.08*lib), '戰利品', '選一招帶走喵！也可以不拿，牌組精簡也是一種強。'); }
function showCardPick(list, title, tip){
  return new Promise(res=>{
    const picks=list.length>3 ? shuffle([...list]).slice(0,3) : list;
    const o=$('#over');
    o.innerHTML = `<div class="panelTitle">${title}</div><div class="miaoTip"><svg viewBox="4 0 56 62">${miaoSVG('happy')}</svg><span>${tip}</span></div>
      <div class="row">${picks.map((c,i)=>cardHTML({id:c.id,up:false},'data-i="'+i+'"')).join('')}</div><button class="btn" id="skipR">不拿了</button>`;
    o.classList.add('on');
    const done=()=>{ o.classList.remove('on'); toMap(); res(); };
    o.querySelectorAll('.row .card').forEach(el=>el.onclick=()=>{ const c=picks[+el.dataset.i]; learn(c.id); SFX.buff(); toast(`學會了「${c.name}」`); done(); });
    $('#skipR').onclick=done;
  });
}

function upCost(){ return Math.max(15,30-3*ax('wis')); }
function showUpgrade(){

function cardHTML(inst, extra='', live, idx){
  const d=CARDS[inst.id];

    if(wouldChain(d)){ cls+=' chainOn'; badges+=`<span class="bdg chain">${d.tag==='f'?'收勢 ×'+({2:1.2,3:1.5}[B.combo+1]||2):'連！'}</span>`; }

function intentText(e){

const COARSE = matchMedia('(pointer:coarse)').matches;
function renderHand(){
  const h=$('#hand');
  if(B.sel!=null && !B.hand[B.sel]) B.sel=null;
  h.style.removeProperty('--cw');
  h.innerHTML = B.hand.map((c,i)=>cardHTML(c, `data-i="${i}" tabindex="0"`, true, i)).join('');
  const n=B.hand.length||1, W=h.parentElement.clientWidth-20, minVis=44;
  const cardMax=(h.firstElementChild&&h.firstElementChild.offsetWidth)||100;
  const cw=Math.round(Math.min(cardMax, Math.max(64, W-(n-1)*minVis)));
  if(cw<cardMax) h.style.setProperty('--cw', cw+'px');
  const step = n>1 ? Math.min(cw+6, (W-cw)/(n-1)) : 0;
  h.style.setProperty('--ov', ((step-cw)/2).toFixed(1)+'px');
  h.querySelectorAll('.card').forEach(el=>{ const i=+el.dataset.i; el.style.setProperty('--k', i-(n-1)/2);
    if(!canPlay(B.hand[i])) el.classList.add('na'); if(B.sel===i) el.classList.add('sel');
    let y0=null;
    el.onpointerdown=(ev)=>{ y0=ev.clientY; };
    el.onpointerup=(ev)=>{ if(y0!=null && y0-ev.clientY>60){ y0=null; B.sel=null; playCard(i, el); ev.preventDefault(); el._dragged=true; } y0=null; };
    el.onclick=(ev)=>{ ev.stopPropagation(); if(el._dragged){ el._dragged=false; return; }
      if(!COARSE){ playCard(i, el); return; }
      if(B.sel===i){ B.sel=null; playCard(i, el); } else { B.sel=i; SFX.click(); renderHand(); }
    };
    el.onmouseenter=()=>{ if(!COARSE && cw<110) showZoom(i); };
    el.onmouseleave=()=>{ if(!COARSE) showZoom(null); };
  });
  showZoom(COARSE ? B.sel : null);

/* ================= 機緣閣（抽卡） ================= */
const RAR=[['N',0,.60],['R',1,.28],['SR',2,.10],['SSR',3,.02]];
function gachaPool(tier){ const all=Object.values(CARDS).filter(c=>c.type!=='curse'&&(!c.sect||c.sect===P.sect));
  return tier===0?all.filter(c=>c.r===1): tier===1?all.filter(c=>c.r===2): tier===2?all.filter(c=>c.r===3): all.filter(c=>c.r===4); }
function rollTier(minTier=0){
  P.pity++; if(P.pity>=40){ P.pity=0; return 3; }
  let x=rnd(), t=0; for(const [n,i,p] of RAR){ if(x<p){ t=i; break; } x-=p; }
  if(t===3) P.pity=0; return Math.max(t,minTier);
}
function gainGachaCard(c){
  const own=[...P.deck,...P.lib].find(x=>x.id===c.id && !x.up && !CARDS[x.id].noUp);
  if(own && P.seenCards[c.id]){ own.up=true; return '化為心得：已有的「'+c.name+'」升級'; }
  learn(c.id, true); return P.seenCards[c.id] ? '收進武學庫' : '新招式！';
}
function pull(n){
  const res=[]; P.stat.pulls=(P.stat.pulls||0)+n;
  for(let k=0;k<n;k++){ const t=rollTier(n===10&&k===9&&!res.some(r=>r.t>=2)?2:0); const c=pick(gachaPool(t)); const isNew=!P.seenCards[c.id]; const msg=gainGachaCard(c); res.push({c,t,msg,isNew}); }
  return res;
}

  o.innerHTML = `<div class="panelTitle">驛站・天下圖</div><p class="hint">點選已開放的地區出發（免費，路上要走 3 天）。</p>

/* ================= 設定、面板關閉、快捷鍵 ================= */
function showSettings(){
  const o=$('#over'), mono=$('#app').classList.contains('mono');
  o.innerHTML=`<div class="panelTitle">設定</div><div class="endBox"><div class="choice">
    <button class="btn" id="sMono">畫風：${mono?'黑白網點':'雙色'}</button><button class="btn" id="sBgm">背景音樂：${BGM.on?'開':'關'}</button><button class="btn" id="sSfx">音效：${AU.on?'開':'關'}</button>
    <p class="hint" style="color:#5a4a3a">電腦快捷鍵：1–9／0 出牌、Q／W 或 ←／→ 換目標、E 或空白鍵收招、R 絕學、Esc 關閉面板、Enter 對話下一句</p>
    <button class="btn red" id="close">關閉</button></div></div>`;
  o.classList.add('on');
  $('#sMono').onclick=()=>{ setMono(!$('#app').classList.contains('mono')); showSettings(); };
  $('#sBgm').onclick=()=>{ AU.init(); BGM.toggle(); updateSndBtns(); showSettings(); };
  $('#sSfx').onclick=()=>{ AU.on=!AU.on; store.set('kuma8wl-audio',AU.on); updateSndBtns(); showSettings(); };
  $('#close').onclick=()=>{ o.classList.remove('on'); if(B&&!B.over&&$('#battle').classList.contains('on')) renderAll(); };
}
const CLOSE_SEL=['#close','#back','#mBack','#skipR','#later','#rBack'];
function overlayEscape(){ const o=$('#over'); for(const s of CLOSE_SEL){ const b=o.querySelector(s); if(b && !b.disabled) return b; } return null; }
function closeOverlay(){ const o=$('#over'); if(!o.classList.contains('on')) return; const b=overlayEscape(); if(b) b.click(); }
function initOverlayWatch(){
  const o=$('#over'), btn=$('#ovClose');
  new MutationObserver(()=>{ btn.classList.toggle('show', o.classList.contains('on') && !!overlayEscape()); }).observe(o,{childList:true,attributes:true,attributeFilter:['class']});
}
function initKeys(){
  document.addEventListener('keydown',(ev)=>{
    if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
    const k=ev.key;
    if($('#talk').classList.contains('on')){ if(k==='Enter'||k===' '||k==='Escape'){ ev.preventDefault(); if(k==='Escape') $('#talk .skip').click(); else $('#talk .tx').click(); } return; }
    if($('#over').classList.contains('on')){ if(k==='Escape'){ ev.preventDefault(); closeOverlay(); } return; }
    if(!$('#battle').classList.contains('on')||!B||B.over) return;
    if(/^[0-9]$/.test(k)){ const i=(+k+9)%10; const el=document.querySelector(`#hand .card[data-i="${i}"]`); if(el){ ev.preventDefault(); playCard(i, el); } return; }
    if(k==='e'||k==='E'||k===' '){ ev.preventDefault(); endTurn(); return; }
    if(k==='r'||k==='R'){ useUlt(); return; }
    if(k==='q'||k==='Q'||k==='ArrowLeft'||k==='w'||k==='W'||k==='ArrowRight'){
      const al=B.enemies.map((e,i)=>e.hp>0?i:-1).filter(i=>i>=0); if(!al.length) return;
      const pos=al.indexOf(B.target), dir=(k==='q'||k==='Q'||k==='ArrowLeft')?-1:1; B.target=al[(pos+dir+al.length)%al.length]; SFX.click(); renderAll(); return; }
    if(k==='a'||k==='A') showDeck(B.draw,'牌庫（順序已打亂）');
    if(k==='d'||k==='D') showDeck(B.disc,'棄牌堆');
  });
}

function arenaPool(region){ const encs=REGIONS[region].nodes.filter(n=>n.type==='battle').flatMap(n=>n.enc); return encs.length?encs:['bandit']; }
function arenaRuleFor(town){ const k=Math.floor(P.day/7)+town.length; return ARENA_RULES[k%ARENA_RULES.length]; }
async function showArena(){
  const town=P.at, name=TOWN_ARENA[town]||'擂台', next=(P.arena||{})[town]||0, rule=arenaRuleFor(town);
  const o=$('#over'); const ready=P.day>=next;

    <div class="arenaBg">${bgSVG('arena',name)}</div>
    <p><b>本週規則：${rule.n}</b><br>${rule.d}</p>
    <p class="hint" style="color:#5a4a3a">連打三場（中間回復 10 氣血），越後面越強。<br>一場：30 兩＋1 令　兩場：70 兩＋2 令　三場奪冠：140 兩＋4 令、稱號${(P.arenaWins||{})[town]?'':'、名聲 +2、首冠送「擂台霸主」'}</p>
    <p>${ready?'今天可以報名！':`下次開賽：第 ${next} 天（今天第 ${P.day} 天）`}　本城奪冠 ${((P.arenaWins||{})[town])||0} 次</p>
    <div class="choice"><button class="btn red" id="aGo" ${ready?'':'disabled'}>報名比武（耗時 1 天）</button><button class="btn" id="close">離開</button></div></div>`;
  o.classList.add('on');
  $('#close').onclick=()=>o.classList.remove('on');
  if(ready) $('#aGo').onclick=()=>{ o.classList.remove('on'); P.arena=P.arena||{}; P.arena[town]=P.day+7; P.stat.tourneyRuns=(P.stat.tourneyRuns||0)+1; P.at_arena={town,rule:rule.id,round:0}; arenaFight(); };
}
function arenaFight(){
  const A=P.at_arena, pool=arenaPool(REGIONS[P.region]?P.region:'zhongyuan'); const r=A.round;
  const enc = r<2 ? [pick(pool), ...(r===1?[pick(pool)]:[])] : [pick(pool),pick(pool)];
  startBattle(NODE[A.town],{enc, bg:'arena', arena:1, rule:A.rule, hpMul:(1+.15*r)*(A.rule==='power'?1.3:1), soft:1});
}
async function arenaEnd(won){
  const A=P.at_arena; const cleared=won?3:A.round; P.at_arena=null;
  const bonus = (A.rule==='nomates'||A.rule==='speed')?1.5:1;
  const prize=[[0,0],[30,1],[70,2],[140,4]][cleared];
  if(cleared>0){ addSilver(Math.round(prize[0]*bonus)); P.token+=prize[1]; }
  let lines=[['司儀','',cleared===3?`冠軍——熊八！`:`熊八止步第 ${cleared+1} 場，共贏 ${cleared} 場！`]];
  if(cleared===3){ P.stat.tourneyWins=(P.stat.tourneyWins||0)+1; P.arenaWins=P.arenaWins||{}; const first=!P.arenaWins[A.town]; P.arenaWins[A.town]=(P.arenaWins[A.town]||0)+1;
    P.titles=P.titles||[]; const t=TOWN_ARENA[A.town]+'冠軍'; if(!P.titles.includes(t)) P.titles.push(t);
    if(first){ gainFame(2); if(!P.seenCards.ltbz){ learn('ltbz'); lines.push(['喵喵','happy','首次奪冠，得到招式「擂台霸主」喵！']); } }
    lines.push(['喵喵','happy',`獲得稱號「${t}」！`]); }
  await talk(lines); save(); toMap();
}

function battleRuleTurnStart(){
  const o=B.o||{};
  if(o.rule==='power') B.en+=1;

}
function ruleStanceMul(m){ return (B&&B.o&&B.o.rule==='stance'&&m>1)?2:m; }
// 萬劫吸內力、冰封
function intentExtra(I){
  if(I.drain||I.freeze){ B.enPenalty=(B.enPenalty||0)+1; fxNote(null, I.drain?'內力被吸走了！下回合 −1':'被冰封！下回合內力 −1'); SFX.bad(); }
  if(I.kpiCheck){ const dealt=B.kpiDmg||0; B.kpiDmg=0; if(dealt<80){ const c=B.hand.length?B.hand.splice(Math.floor(rnd()*B.hand.length),1)[0]:(B.draw.length?B.draw.pop():null); if(c){ B.exh.push(c); fxNote(null,`績效不足（${dealt}/80）：「${CARDS[c.id].name}」被優化了！`); } } else fxNote(null,`績效達標（${dealt}）`); }
}
// 雁回谷：兩人同時半血就停戰
function truceCheck(){
  if(B.node.id!=='mb_valley'||B.over) return false;
  const [a,b]=B.enemies.filter(e=>ENEMY[e.key].boss);
  if(!a||!b) return false;
  if(a.hp<=0 || b.hp<=0){ const alivE=a.hp>0?a:b; if(alivE.hp>0 && !alivE.enraged){ alivE.enraged=1; alivE.st.str+=6; fxNote(alivE,'暴走！'); talk(SCRIPT.vgLoseOne); } return false; }
  return a.hp<=a.max/2 && b.hp<=b.max/2;
}

/* ---------- 雲端存檔、備份、存檔碼 ---------- */
const CLOUD = { db:null, uid:null, timer:null, busy:false, status:'僅本機', last:0 };
async function cloudInit(){
  try{
    if(typeof claude==='undefined' || !claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    CLOUD.db=db; CLOUD.uid=uid; CLOUD.status='雲端連線中';
    const snap=await db.doc(`data/users/${uid}/save`).get();
    if(snap.exists){ const d=snap.data(); const local=store.get(SAVE_KEY,null);
      if(d && d.json && (!local || (d.savedAt||0) > (local.savedAt||0))){ try{ const s=JSON.parse(d.json); store.set(SAVE_KEY,s); if($('#title').classList.contains('on')) renderTitle(); toast('已從雲端讀取存檔'); }catch(e){} } }
    CLOUD.status='雲端已同步'; updateSaveStatus();
  }catch(e){ CLOUD.status='僅本機'; }
}
function cloudPush(){
  if(!CLOUD.db||!P) return; clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(async()=>{ if(CLOUD.busy){ cloudPush(); return; } CLOUD.busy=true;
    try{ const body={json:JSON.stringify(P), savedAt:P.savedAt||Date.now(), ver:GAME_VERSION, sect:P.sect, lv:P.lv, day:P.day};
      await CLOUD.db.doc(`data/users/${CLOUD.uid}/save`).set(body);
      if(Date.now()-CLOUD.last>600000){ CLOUD.last=Date.now(); await CLOUD.db.doc(`data/users/${CLOUD.uid}/backup`).set(body); }
      CLOUD.status='雲端已同步'; }catch(e){ CLOUD.status='雲端暫時無法連線（本機已存）'; }
    CLOUD.busy=false; updateSaveStatus(); }, 1500);
}
function updateSaveStatus(){ const el=document.getElementById('saveStatus'); if(el) el.textContent='存檔：'+CLOUD.status; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden && CLOUD.db && P){ clearTimeout(CLOUD.timer); CLOUD.timer=null; CLOUD.busy=false; const body={json:JSON.stringify(P), savedAt:P.savedAt||Date.now(), ver:GAME_VERSION, sect:P.sect, lv:P.lv, day:P.day}; CLOUD.db.doc(`data/users/${CLOUD.uid}/save`).set(body).catch(()=>{}); } });
function saveCode(){ return 'KMWL:'+btoa(unescape(encodeURIComponent(JSON.stringify(P)))); }
function loadCode(code){ try{ code=code.trim(); if(code.startsWith('KMWL:')) code=code.slice(5); const s=JSON.parse(decodeURIComponent(escape(atob(code)))); if(!s.sect) throw 0; migrate(s); return s; }catch(e){ return null; } }
function showSaveCode(){
  const o=$('#over');
  o.innerHTML=`<div class="panelTitle">存檔碼</div><div class="endBox"><p>${P?'複製下面這串文字保存起來，換裝置或更新後都能貼回來。':'貼上之前複製的存檔碼。'}</p>
    <textarea id="codeBox" style="width:100%;height:140px;font-size:12px">${P?saveCode():''}</textarea>
    <div class="choice" style="flex-direction:row;flex-wrap:wrap;justify-content:center">${P?'<button class="btn gold" id="copy">複製</button>':''}<button class="btn red" id="imp">讀取存檔碼</button><button class="btn" id="close">關閉</button></div>
    <p class="hint" style="color:#5a4a3a" id="saveStatus">存檔：${CLOUD.status}</p></div>`;
  o.classList.add('on');
  if($('#copy')) $('#copy').onclick=()=>{ const t=$('#codeBox'); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } toast('已複製'); };
  $('#imp').onclick=()=>{ const s=loadCode($('#codeBox').value); if(!s){ toast('存檔碼格式不正確'); return; } P=s; save(); o.classList.remove('on'); toast('讀取成功'); toMap(); };
  $('#close').onclick=()=>o.classList.remove('on');
}

function eqItem(s,uid){ return (s.bag||[]).find(b=>b.uid===uid); }
function eqStats(it){ const E=EQUIP[it.id]; const st=JSON.parse(JSON.stringify(E.st)); if(it.plus){ st[E.up]=(st[E.up]||0)+E.step*it.plus; } return st; }
function eqSumOf(s,key){ if(!s||!s.equip) return 0; let v=0; for(const k of ['w','a','o']){ const it=eqItem(s,s.equip[k]); if(it){ const st=eqStats(it); if(key==='att') continue; v+=st[key]||0; } } return v; }
function eqSum(key){ return eqSumOf(P,key); }
function eqAtt(attr){ if(!P||!P.equip||!attr) return 0; let v=0; for(const k of ['w','a','o']){ const it=eqItem(P,P.equip[k]); if(it){ const a=eqStats(it).att; if(a&&a[attr]) v+=a[attr]; } } return v; }
function eqBonus(d, preview){ if(!P||!d||d.type!=='atk'||d.qi||d.ult) return 0; let b=eqSum('dmg')+eqAtt(d.attr);
  if(d.tag==='f' && (preview ? B&&B.combo>=1 : B&&B.cur&&B.cur.chain)) b+=eqSum('fin'); return b; }

function eqDesc(it){ const st=eqStats(it); const L=[]; Object.entries(st).forEach(([k,v])=>{ if(k==='att') Object.entries(v).forEach(([a,n])=>L.push(`「${a}」招傷害 +${n}`)); else L.push(`${ST_N[k]} +${v}`); }); return L.join('、'); }

function forgeCost(it){ return 40*(EQUIP[it.id].tier+1)*(it.plus+1); }

  o.querySelectorAll('[data-fg]').forEach(b=>b.onclick=()=>{ const it=eqItem(P,b.dataset.fg), c=forgeCost(it); if(P.silver<c){ toast('銀兩不足'); return; } P.silver-=c; it.plus++; recalc(); SFX.coin(); toast(`${EQUIP[it.id].name} 強化到 +${it.plus}！`); save(); showEquip(); });

const B_CRIME=['在客棧點了十碗麵只付一碗','偷吃寺廟供品還留下好評','冒充熊八到處白吃白喝','把丐幫的碗換成了紙碗','在擂台上偷偷塗油','搶走小朋友的糖葫蘆','用假銀子買真烤鴨','把鏢局的鏢車開去兜風','在說書人講到高潮時劇透','偷了廚神的祖傳醬料','在武林大會門口賣假門票','把峨嵋的劍全部磨鈍','冒用萬劫門名義收保護費','偷走了喵喵的小魚乾','在溫泉裡亂丟肥皂','把唐門的毒藥換成了胡椒'];
function bountyRankFor(){ const v=(P.flags.vol1?1:0)+(P.flags.vol2?1:0)+(P.flags.vol3?1:0)+(P.flags.vol4?1:0); const w=[[6,3,1,0,0],[3,4,2,1,0],[2,3,3,2,1],[1,2,3,3,2],[1,1,3,3,3]][v]; let x=rnd()*w.reduce((a,b)=>a+b,0); for(let i=0;i<5;i++){ if(x<w[i]) return i; x-=w[i]; } return 0; }
function genBounty(){
  const regs=openRegions(); const r=pick(regs); const nodes=REGIONS[r].nodes.filter(n=>['battle','event','elite','master','dungeon'].includes(n.type)); if(!nodes.length) return null;
  const rank=bountyRankFor(); const pool=arenaPool(r); let key = rank>=2 ? (regionElite(r)||pick(pool)) : pick(pool); if(rank===4) key=pick(['wjelite','wjdis','mojiao'].filter(k=>ENEMY[k]));
  return { id:'bt'+Date.now().toString(36)+ri(100,999), name:pick(B_NICK)+pick(B_NAME), crime:pick(B_CRIME), rank, region:r, node:pick(nodes).id, until:P.day+ri(rank>=3?6:4, rank>=3?10:8), key, acc:false, roam:rank>=3 };
}
function bountyInit(){ P.bounty=P.bounty||{list:[],next:0}; }
function bountyRefresh(force){
  bountyInit(); const BT=P.bounty;
  BT.list=BT.list.filter(b=>{ if(P.day>b.until){ if(b.acc) toast(`懸賞「${b.name}」逾期，嫌犯逃走了`); return false; } return true; });
  if(force || P.day>=BT.next){ BT.list=BT.list.filter(b=>b.acc); BT.next=P.day+7; }
  while(BT.list.length<4){ const b=genBounty(); if(!b) break; BT.list.push(b); BT.fresh=1; }
}
function bountyRec(b){ return regionBase(b.region)+B_RANK[b.rank].lv; }
function threat(b){ const d=bountyRec(b)-P.lv; return d<=-3?['輕鬆','#3f8a5a']:d<=1?['勢均力敵','#c99a1d']:d<=4?['危險','#d4782a']:['送死','#c8402e']; }
function bountyRoam(){ bountyInit(); P.bounty.list.forEach(b=>{ if(b.acc && b.roam && rnd()<.5){ const adj=(ADJ[b.node]||[]).filter(id=>NODE[id] && NODE[id].region===b.region && !['town','boss','story'].includes(NODE[id].type)); if(adj.length){ b.node=pick(adj); } } }); }

      <div class="wPrize">賞銀 ${R.s} 兩・名聲 +${R.f}${R.t?`・俠緣令 ${R.t}`:''}${b.rank>=3?'・可能掉裝備':''}</div>

   <div class="choice"><button class="btn red" id="close">關閉</button></div>`;
  o.classList.add('on');

  o.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{ const x=P.bounty.list.find(y=>y.id===b.dataset.drop); x.acc=false; save(); showBounty(); });

function bountyAt(id){ return P.bounty&&P.bounty.list.find(b=>b.acc&&b.node===id&&b.region===P.region); }
async function fightBounty(b){
  await talk([['喵喵','shock',`找到了！懸賞犯「${b.name}」——罪名：${b.crime}！`],['熊八','fire','站住！一百二十公斤的正義來了！','lines']]);
  passDay(1);
  const pool=arenaPool(b.region); const enc=[b.key, ...(b.rank>=1&&b.rank<4?[pick(pool)]:[]), ...(b.rank===4?[pick(pool),pick(pool)].slice(0,1):[])];
  startBattle(NODE[b.node],{enc, bounty:b.id, hpMul:B_RANK[b.rank].mul*(1+.05*Math.max(0,regionTier(b.region)-1))});
  const e=B.enemies[0]; e.name=`【${B_RANK[b.rank].n}】${b.name}`; e.elite=true; renderEnemies(true);

async function bountyWin(id){
  const b=P.bounty.list.find(x=>x.id===id); if(!b) return false; const R=B_RANK[b.rank];
  P.bounty.list=P.bounty.list.filter(x=>x.id!==id); P.stat.bounty=(P.stat.bounty||0)+1;
  addSilver(R.s); gainFame(R.f); P.token+=R.t;
  const lines=[['捕快','',`懸賞犯「${b.name}」緝拿歸案！賞銀 ${R.s} 兩奉上！`]];
  if(b.rank===4 || (b.rank===3 && rnd()<.3)){ const id2=rollEquip(b.rank===4?Math.min(3,1+Math.floor(regionTier(b.region)/2)+1):Math.min(3,1+Math.floor(regionTier(b.region)/2))); giveEquip(id2); lines.push(['喵喵','happy',`嫌犯身上搜出了「${EQUIP[id2].name}」喵！`]); }
  P.titles=P.titles||[]; [[10,'捕快之友'],[30,'江湖神捕']].forEach(([n,t])=>{ if(P.stat.bounty>=n && !P.titles.includes(t)){ P.titles.push(t); lines.push(['喵喵','happy',`緝拿 ${n} 名嫌犯，獲得稱號「${t}」！`]); } });
  bountyRefresh(); await talk(lines); save(); toMap(); return true;
}

const MJ_T = {
  jianzhong:{n:'劍塚', bg:'bamboo', slot:'w', d:'埋著上千把名劍的山谷，劍客的怨念還沒散。'},
  yaowang:{n:'藥王谷', bg:'herb', slot:'o', d:'遍地奇花異草，也遍地毒蛇。'},
  cangjing:{n:'藏經洞', bg:'temple2', slot:null, d:'石壁上刻滿失傳的功法。'},
  jiguan:{n:'機關城', bg:'city', slot:'a', d:'墨家留下的機關城，齒輪還在轉。'},
  baoku:{n:'寶庫', bg:'palace', slot:'any', d:'某位守財奴的私人金庫。'},
};
function mjSpawn(){
  const regs=openRegions(); const r=pick(regs); const nodes=REGIONS[r].nodes.filter(n=>['battle','event','elite'].includes(n.type)); if(!nodes.length) return;
  const t=pick(Object.keys(MJ_T)); const n=pick(nodes);
  P.mj={t, region:r, node:n.id, until:P.day+5}; P.mjNext=P.day+ri(8,12);
  toast(`秘境「${MJ_T[t].n}」出現在${REGIONS[r].name}・${n.name}！（5 天後消失）`); P.flags.mjNew=1;
}
function mjFloors(r){ return [3,3,4,5][regionTier(r)]; }
function mjEnter(){
  const M=P.mj; if(!M) return; passDay(1);
  P.mjRun={t:M.t, region:M.region, node:M.node, floor:1, max:mjFloors(M.region), got:[]}; P.mj=null; P.stat.mj=(P.stat.mj||0)+1;
  talk([['喵喵','shock',`這裡就是秘境「${MJ_T[M.t].n}」喵！${MJ_T[M.t].d}`],['老鬼','smile',`共 ${P.mjRun.max} 層。每層選一條路，最深處有守護者。撐不住就撤退，拿到的東西不會不見。`]]).then(()=>mjFloor());
}
const MJ_PATH={fight:['戰','與秘境守衛交手（銀兩）'],chest:['寶','開啟寶箱'],rest:['休','休息：回 30% 氣血'],event:['奇','未知的奇遇'],shop:['商','秘境商人']};
function mjFloor(){
  const R=P.mjRun; if(!R) return; const o=$('#over'); const last=R.floor>=R.max;
  let opts = last ? ['boss'] : [...new Set([pick(['fight','fight','chest']), pick(['rest','event','shop','chest']), pick(['fight','event','chest'])])];
  R.opts=opts;
  o.innerHTML=`<div class="panelTitle">秘境・${MJ_T[R.t].n}　第 ${R.floor}／${R.max} 層</div>
   <div class="endBox mjBox"><div class="arenaBg">${bgSVG(MJ_T[R.t].bg)}</div>
   <p>氣血 ${P.hp}/${P.max}　本次收穫：${R.got.length?R.got.join('、'):'（還沒有）'}</p>
   <div class="mjPaths">${opts.map(k=>k==='boss'?`<button class="mjPath boss" data-p="boss"><b>首</b><span>秘境守護者</span><small>打倒它，取得秘境寶物</small></button>`:`<button class="mjPath" data-p="${k}"><b>${MJ_PATH[k][0]}</b><span>${MJ_PATH[k][1]}</span></button>`).join('')}</div>
   <div class="choice"><button class="btn" id="mjOut">撤退（保留收穫）</button></div></div>`;
  o.classList.add('on');
  o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ o.classList.remove('on'); mjDo(b.dataset.p); });
  $('#mjOut').onclick=()=>{ o.classList.remove('on'); P.mjRun=null; toast('撤出秘境'); save(); toMap(); };
}
async function mjDo(k){
  const R=P.mjRun, tier=regionTier(R.region);
  if(k==='fight'||k==='boss'){ const pool=arenaPool(R.region);
    const enc = k==='boss' ? [regionElite(R.region)||pick(pool), pick(pool)] : [pick(pool), ...(rnd()<.6?[pick(pool)]:[])];
    startBattle(NODE[R.node],{enc, mj:k, bg:MJ_T[R.t].bg, hpMul:1+.1*R.floor+(k==='boss'?.3:0)});
    if(k==='boss'){ const e=B.enemies[0]; e.name=`${MJ_T[R.t].n}守護者・${e.name}`; e.elite=true; renderEnemies(true); }
    return; }
  if(k==='rest'){ P.hp=Math.min(P.max,P.hp+Math.round(P.max*.3)); await talk([['喵喵','happy','在石洞裡睡了一覺，氣血回復喵！']]); }
  if(k==='chest'){ const x=rnd();
    if(x<.45){ const s=ri(20,40)*(tier+1); addSilver(s); R.got.push(`銀兩 ${s}`); await talk([['喵喵','happy',`寶箱裡有 ${s} 兩銀子喵！`]]); }
    else if(x<.75){ const c=pick(rewardPool().filter(c=>c.type==='item'||c.r>=2)); learn(c.id,true); R.got.push(c.name); await talk([['喵喵','happy',`寶箱裡有一本秘笈：「${c.name}」（收進武學庫）喵！`]]); }
    else { const id=rollEquip(Math.min(3,tier>=2?ri(1,2):ri(0,1))); giveEquip(id,0,true); R.got.push(EQUIP[id].name); await talk([['喵喵','happy',`寶箱裡有裝備「${EQUIP[id].name}」喵！`]]); } }
  if(k==='event'){ const e=ri(0,3);
    if(e===0){ const gs=Object.keys(P.mastery); const g=gs.length?pick(gs):'江湖通用'; P.mastery[g]=(P.mastery[g]||0)+12; masteryCheck(); R.got.push(`${g} 熟練 +12`); await talk([['老鬼','smile',`石壁上的刻痕……是「${g}」的心法！熟練度 +12。`]]); }
    else if(e===1){ P.hp=Math.max(1,P.hp-10); P.token+=2; R.got.push('俠緣令 2'); await talk([['','','踩到機關！氣血 −10……但機關後面藏著 2 枚俠緣令。'],['熊八','hurt','痛並快樂著。']]); }
    else if(e===2){ gainFame(1); R.got.push('名聲 +1'); await talk([['','','你救出了被困在秘境裡的樵夫。'],['樵夫','','大俠！我會到處宣傳您的善行！']]); }
    else { P.pts++; R.got.push('屬性點 +1'); await talk([['','','秘境深處有一口靈泉，喝下去神清氣爽。'],['喵喵','happy','屬性點 +1 喵！']]); } }
  if(k==='shop'){ const items=[rollEquip(Math.min(3,tier)), rollEquip(Math.max(0,tier-1))]; const price=id=>70*(EQUIP[id].tier+1);
    const opts=items.map(id=>`買【${TIER_N[EQUIP[id].tier]}】${EQUIP[id].name}（${price(id)} 兩）${P.silver<price(id)?'（銀兩不足）':''}`).concat(['不買了']);
    const c=await choose(`秘境商人：「客官，有緣才賣。」　銀兩 ${P.silver}`, opts);
    if(c<2 && P.silver>=price(items[c])){ P.silver-=price(items[c]); giveEquip(items[c]); R.got.push(EQUIP[items[c]].name); } }
  mjNext();
}
function mjNext(){ const R=P.mjRun; if(!R) return; R.floor++; save(); if($('#battle').classList.contains('on')) show('map'); mjFloor(); }
async function mjWin(kind){
  const R=P.mjRun; if(!R) return false; const tier=regionTier(R.region);
  if(kind==='fight'){ const s=ri(12,24)*(tier+1); addSilver(s); R.got.push(`銀兩 ${s}`); R.floor++; save(); show('map'); renderMap(); mjFloor(); return true; }
  // 首領：結算
  const T=MJ_T[R.t]; const et=Math.min(3, tier+ (rnd()<.35?1:0)); const lines=[['喵喵','happy',`秘境「${T.n}」攻略完成喵！`]];
  const slot = T.slot==='any' ? pick(['w','a','o']) : T.slot;
  if(slot){ const id=rollEquip(et, slot); giveEquip(id,0,true); R.got.push(EQUIP[id].name); lines.push(['喵喵','happy',`獲得裝備【${TIER_N[EQUIP[id].tier]}】${EQUIP[id].name}！`]); }
  if(R.t==='cangjing'){ const c=pick(gachaPool(Math.min(3,1+Math.floor(tier/2)))); learn(c.id,true); R.got.push(c.name); lines.push(['老鬼','smile',`石壁上的功法，老夫替你抄下來了：「${c.name}」。`]); }
  if(R.t==='yaowang'){ ['jcy','xld'].filter(k=>CARDS[k]).forEach(k=>learn(k,true)); lines.push(['喵喵','happy','還採到了金創藥與雪蓮丹（收進武學庫）！']); }
  if(R.t==='baoku'){ const s=80*(tier+1); addSilver(s); lines.push(['喵喵','happy',`守財奴的金庫：銀兩 +${s}！`]); }
  if(R.t==='jianzhong'||R.t==='jiguan'){ gainFame(1); }
  P.token+=1+tier; lines.push(['喵喵','smile',`俠緣令 +${1+tier}。這次收穫：${R.got.join('、')}`]);
  P.mjRun=null; P.stat.mjClear=(P.stat.mjClear||0)+1;
  show('map'); renderMap(); await talk(lines); save(); toMap(); return true;
}

function passDay(n=1){
  P.day=(P.day||1)+n;

  if(P.day % 10 === 0) P.flags.newsDue=1;
  // 秘境
  if(P.mj && P.day>P.mj.until && !P.mjRun){ toast(`秘境「${MJ_T[P.mj.t].n}」消失了……`); P.mj=null; }

  checkClanRank();
}

const _bgmInst = BGM.inst.bind(BGM);
BGM.inst = function(kind,fr,t,d,v){
  const c=AU.ctx; if(!c) return;
  if(kind==='erhu'){ const o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter(), lfo=c.createOscillator(), lg=c.createGain();
    o.type='sawtooth'; o.frequency.value=fr; lfo.frequency.value=5.6; lg.gain.value=fr*.014; lfo.connect(lg).connect(o.frequency);
    fl.type='lowpass'; fl.frequency.value=1700; fl.Q.value=2;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.9,t+.07); g.gain.linearRampToValueAtTime(v*.65,t+d*.75); g.gain.linearRampToValueAtTime(.0001,t+d);
    o.connect(fl).connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05); lfo.start(t); lfo.stop(t+d+.05); return; }
  if(kind==='xiao'){ const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
    o.type='sine'; o.frequency.value=fr; o2.type='triangle'; o2.frequency.value=fr; lfo.frequency.value=4.6; lg.gain.value=fr*.008; lfo.connect(lg).connect(o.frequency);
    const g2=c.createGain(); g2.gain.value=.25;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.14); g.gain.linearRampToValueAtTime(v*.6,t+d*.7); g.gain.linearRampToValueAtTime(.0001,t+d);
    o.connect(g); o2.connect(g2).connect(g); g.connect(c.destination); [o,o2,lfo].forEach(x=>{ x.start(t); x.stop(t+d+.05); }); return; }
  if(kind==='zheng'){ const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
    o.type='triangle'; o.frequency.value=fr; o2.type='sawtooth'; o2.frequency.value=fr*1.003;
    const g2=c.createGain(); g2.gain.value=.18; fl.type='lowpass'; fl.frequency.setValueAtTime(5200,t); fl.frequency.exponentialRampToValueAtTime(700,t+d*1.4);
    g.gain.setValueAtTime(v*1.1,t); g.gain.exponentialRampToValueAtTime(.001,t+d*1.6);
    o.connect(fl); o2.connect(g2).connect(fl); fl.connect(g).connect(c.destination); [o,o2].forEach(x=>{ x.start(t); x.stop(t+d*1.6+.05); }); return; }
  if(kind==='bell'){ [[1,1],[2.76,.45],[5.4,.2]].forEach(([m,a])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=fr*m;
      g.gain.setValueAtTime(v*a*1.2,t); g.gain.exponentialRampToValueAtTime(.0005,t+d*2.2/m); o.connect(g).connect(c.destination); o.start(t); o.stop(t+d*2.2+.05); }); return; }
  return _bgmInst(kind,fr,t,d,v);
};

function pathNext(from,goal){ const prev={}; const q=[from]; prev[from]=null; while(q.length){ const x=q.shift(); if(x===goal) break; for(const y of ADJ[x]||[]){ if(!(y in prev)){ prev[y]=x; q.push(y); } } } if(!(goal in prev)) return null; let c=goal; while(prev[c]!==from && prev[c]!=null) c=prev[c]; return c; }
function nearestUncleared(){ const R=REGIONS[P.region]; const cand=R.nodes.filter(n=>['battle','event','master','elite','dungeon'].includes(n.type)&&!P.cleared[n.id]); if(!cand.length) return null;
  const dist={}; const q=[P.at]; dist[P.at]=0; while(q.length){ const x=q.shift(); for(const y of ADJ[x]||[]) if(dist[y]==null){ dist[y]=dist[x]+1; q.push(y); } }
  cand.sort((a,b)=>(dist[a.id]??99)-(dist[b.id]??99)); return cand[0]; }
function guideTarget(){
  const g=goalInfo();
  if(g.region && g.region!==P.region) return {node:REGIONS[P.region].start, why:`先回${NODE[REGIONS[P.region].start].name}，從驛站前往${REGIONS[g.region].name}`};
  if(g.node && NODE[g.node] && NODE[g.node].region===P.region) return {node:g.node, why:NODE[g.node].name};
  const n=nearestUncleared(); if(n) return {node:n.id, why:`${n.name}（還沒去過，可以賺名聲）`};
  return null;
}

const SET_KEY='kuma8wl-set';
const SETS = Object.assign({ master:80, bgm:70, sfx:80, text:'mid', auto:false, speed:'normal', noShake:false }, store.get(SET_KEY,{}));
function setSave(){ store.set(SET_KEY, SETS); }

// 音量：把 Web Audio 的輸出分成音樂／音效兩路，再接主音量
const VOL = { master:null, bgm:null, sfx:null };
function audioSetup(){
  const c=AU.ctx; if(!c||c._kk8) return;
  try{
    let proto=Object.getPrototypeOf(c), desc=null;
    while(proto && !(desc=Object.getOwnPropertyDescriptor(proto,'destination'))) proto=Object.getPrototypeOf(proto);
    if(!desc||!desc.get) return;
    const real=desc.get.call(c);
    VOL.master=c.createGain(); VOL.master.connect(real);
    VOL.bgm=c.createGain(); VOL.bgm.connect(VOL.master);
    VOL.sfx=c.createGain(); VOL.sfx.connect(VOL.master);
    Object.defineProperty(c,'destination',{configurable:true, get(){ return AU._route==='bgm'?VOL.bgm:VOL.sfx; }});
    c._kk8=1; applyVol();
  }catch(e){}
}
function applyVol(){ if(!VOL.master) return; VOL.master.gain.value=SETS.master/100; VOL.bgm.gain.value=SETS.bgm/100; VOL.sfx.gain.value=SETS.sfx/100; }
const _auInit8=AU.init.bind(AU);
AU.init=function(){ _auInit8(); audioSetup(); };
const _bgmInst8=BGM.inst.bind(BGM);
BGM.inst=function(...a){ const r0=AU._route; AU._route='bgm'; try{ return _bgmInst8(...a); } finally{ AU._route=r0; } };

function applySettings(){
  $('#app').classList.toggle('noShake', !!SETS.noShake);
  if(!window.__BOT){ if(SETS.speed==='fast') window.__FAST=.6; else if(window.__FAST===.6) delete window.__FAST; }
  applyVol();
}

function toggleFull(){
  const d=document, el=d.documentElement;
  try{
    if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
    const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(()=>toast('這個視窗不允許全螢幕，可以改用瀏覽器的全螢幕（F11）'));
  }catch(e){ toast('這個視窗不允許全螢幕，可以改用瀏覽器的全螢幕（F11）'); }
}

// 對話：文字速度＋自動播放
const TXT_MS={slow:45, mid:26, fast:12, instant:0};
talkRaw=function(lines){
  return new Promise(res=>{
    if(!lines||!lines.length){ res(); return; }
    const el=$('#talk'); el.classList.add('on'); let i=-1, typing=null, full='', autoT=null;
    const por=el.querySelector('.por'), nm=el.querySelector('.nm'), tx=el.querySelector('.tx'), fx=el.querySelector('.bgFx');
    const fastBot = window.__FAST && window.__FAST<.3;
    const ms = fastBot ? 26*window.__FAST : (TXT_MS[SETS.text]??26);
    const armAuto=()=>{ clearTimeout(autoT); if(SETS.auto && !fastBot) autoT=setTimeout(()=>next(), 900+full.length*55); };
    const done=()=>{ clearInterval(typing); typing=null; tx.textContent=full; armAuto(); };
    const next=()=>{
      clearTimeout(autoT);
      if(typing){ done(); return; }
      i++; if(i>=lines.length){ el.classList.remove('on'); el.onclick=null; fx.classList.remove('on'); res(); return; }
      const [who,expr,text,bg]=lines[i]; full=text;
      el.classList.toggle('narr', !who);
      nm.textContent=who; nm.style.display=who?'':'none';
      por.innerHTML = ST_ART[who] ? ST_ART[who](expr) : `<div class="noPor">${who?who[0]:''}</div>`;
      if(bg==='lines'){ fx.innerHTML=mangaLinesSVG(60,'#111',110); fx.classList.add('on'); } else fx.classList.remove('on');
      if(!ms){ tx.textContent=full; armAuto(); return; }
      tx.textContent=''; let k=0; const pitch={熊八:.8,喵喵:1.6,老鬼:.6,錢有理:1.1,林小滿:1.4,慧能:1.25,鐵牛:.7,沐清風:1.05}[who]||1;
      typing=setInterval(()=>{ k++; tx.textContent=full.slice(0,k); if(k%2) SFX.talk(pitch); if(k>=full.length) done(); }, ms);
    };
    el.onclick=(ev)=>{ if(ev.target.closest('.skip')){ clearTimeout(autoT); i=lines.length; if(typing){clearInterval(typing);typing=null;} next(); return; } next(); };
    next();
  });
};

  B.draw=[...D, ...second, ...first.reverse()];
  const eA=B.enemies[0], eB=B.enemies[1];

function playOpening(){
  if(window.__BOT) return Promise.resolve();
  return new Promise(res=>{
    let el=$('#opening'); if(!el){ $('#app').insertAdjacentHTML('beforeend','<div id="opening"></div>'); el=$('#opening'); }
    let i=-1, timer=null, typing=null;
    el.innerHTML=`<div class="opFrame"></div><div class="opCap"></div><div class="opBar"><div class="opDots">${OP_PANELS.map(()=>'<i></i>').join('')}</div><span class="opHint">點畫面下一格</span><button class="btn sm" id="opSkip">跳過 ▶▶</button></div>`;
    el.classList.add('on');
    const frame=el.querySelector('.opFrame'), cap=el.querySelector('.opCap'), dots=el.querySelectorAll('.opDots i');
    const end=()=>{ clearTimeout(timer); clearInterval(typing); el.classList.remove('on'); el.innerHTML=''; el.onclick=null; res(); };
    const next=()=>{
      clearTimeout(timer); clearInterval(typing); i++; if(i>=OP_PANELS.length){ end(); return; }
      const Pn=OP_PANELS[i]; dots.forEach((d,k)=>d.classList.toggle('on',k<=i));
      frame.innerHTML=`<div class="opIn enter"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">${Pn.svg}</svg></div>${Pn.sfx}`;
      if(i===3||i===5) SFX.heavy(); else if(i===4) SFX.gong(); else if(i===7) SFX.win(); else SFX.drum();
      const ms=(TXT_MS[SETS.text]??26)||0; cap.textContent='';
      if(!ms) cap.textContent=Pn.cap; else { let k=0; typing=setInterval(()=>{ k++; cap.textContent=Pn.cap.slice(0,k); if(k>=Pn.cap.length) clearInterval(typing); }, ms+10); }
      timer=setTimeout(next, i===OP_PANELS.length-1?4200:3600);
    };
    el.onclick=(ev)=>{ if(ev.target.closest('#opSkip')){ end(); return; } next(); };
    BGM.play('map'); next();
  });
}
