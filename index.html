--sash:url(#toneD); --sashD:#111; --gold:url(#toneL); --goldD:url(#toneM);
--bandit:url(#toneM); --banditD:url(#toneD); --blue:url(#toneM); --blueD:url(#toneD);

--jade:url(#toneL); --jadeD:url(#toneM); --miao:#fff; --miaoD:url(#toneL); --wing:#fff; --wingD:url(#toneL);
--white:#fff; --steel:#fff; --steelD:url(#toneL); --wood:url(#toneL); --woodD:url(#toneM);

.ground{fill:var(--ground)} .groundD{fill:var(--groundD)}
.skin{fill:var(--skin)} .skinD{fill:var(--skinD)} .cheek{fill:var(--cheek)} .pale{fill:var(--pale)} .paleD{fill:var(--paleD)}
.hair{fill:var(--hair)} .grey{fill:var(--grey)} .greyD{fill:var(--greyD)}
.robeW{fill:var(--robeW)} .robeWD{fill:var(--robeWD)} .robeT{fill:var(--robeT)} .robeTD{fill:var(--robeTD)} .robeK{fill:var(--robeK)} .robeKD{fill:var(--robeKD)} .robeG{fill:var(--robeG)} .robeGD{fill:var(--robeGD)} .robeS{fill:var(--robeS)} .robeSD{fill:var(--robeSD)} .robeE{fill:var(--robeE)} .robeED{fill:var(--robeED)} .trim{fill:var(--trim)}

.shd{fill:var(--shadow)} .mist{fill:var(--mist)} .ink{fill:#111} .nofill{fill:none}
.art{stroke:#111;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ns,.ns *{stroke:none}
.thin{stroke-width:1.6;fill:none}
.hl{stroke-width:1.1;fill:none}
.wl{stroke:#fff;stroke-width:1.2;fill:none;opacity:.75}
.art .body,.art .head,.art .armL,.art .armR,.art .floaty,.art .wingL,.art .wingR,.art .wisp{transform-box:fill-box}
.idle .body{animation:breathe calc(1.8s * var(--spd,1)) ease-in-out infinite;transform-origin:50% 100%}
.idle .head{animation:bob calc(1.8s * var(--spd,1)) ease-in-out infinite;transform-origin:50% 100%}
.float{animation:floaty 2.6s ease-in-out infinite}
.art .wingL{animation:flapL .5s ease-in-out infinite;transform-origin:100% 80%}
.art .wingR{animation:flapR .5s ease-in-out infinite;transform-origin:0% 80%}
.art .wisp{animation:wisp 2.2s ease-in-out infinite;transform-origin:50% 0%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.8px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
@keyframes wisp{0%,100%{transform:skewX(0)}50%{transform:skewX(8deg)}}
@media (prefers-reduced-motion:reduce){.art *,.float{animation:none!important}}
:root{
--ui-bg:#1d1916; --ui-panel:#211c18; --ui-text:#f3ead6; --ui-dim:#b9ac92; --ui-line:#f3ead6; --ui-accent:#e3b341; --ui-red:#c8402e;
--ui-radius:6px; --ui-border:3px; --ui-btn-minh:44px; --ui-font:'LXGW WenKai TC','Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
--card-bg:#f4ead2; --card-ink:#1a1612; --cAtk:#c8402e; --cDef:#2f8f9d; --cMind:#c99a1d; --cItem:#7d7468; --cCurse:#2a2a2a;
--cw:clamp(84px,min(27vw,16vh),126px);
}
.mono{ --card-bg:#fff; --cAtk:#111; --cDef:#555; --cMind:#888; --cItem:#aaa; --ui-red:#111; --ui-accent:#fff }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:var(--ui-font);overflow:hidden}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;max-width:1280px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);margin:0 auto;overflow:hidden;background:#2a241f}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{min-height:var(--ui-btn-minh);padding:8px 18px;border:var(--ui-border) solid var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-panel);color:var(--ui-text);font-size:17px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;letter-spacing:.06em}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--ui-red);border-color:#111;color:#fff}
.btn.gold{background:var(--ui-accent);border-color:#111;color:#111}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.topbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:40}
#app:has(#battle.on) .topbar{display:none}
.mono .btn.red{background:#111;color:#fff;border-color:#fff}
#title{align-items:center;justify-content:center;background:var(--card-bg);color:#1a1612;overflow:hidden}
#title .bgArt{position:absolute;inset:0}
#title .bgArt svg{width:100%;height:100%}
.ttl{position:relative;text-align:center;z-index:2;margin-top:-6vh}
.ttl h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(48px,13vw,92px);margin:0;letter-spacing:.08em;color:#111;text-shadow:3px 3px 0 #e3b341}
.mono .ttl h1{text-shadow:3px 3px 0 #bbb}
.ttl .sub{font-size:clamp(14px,3.6vw,19px);margin:4px 0 0;color:#3a2f25}
.ttl .heroes{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:8px 0 12px}
.ttl .heroes svg{width:clamp(80px,22vw,130px);height:auto;overflow:visible}
.ttl .heroes .big{width:clamp(130px,36vw,210px)}
.ttl .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.ttl .ver{margin-top:14px;font-size:13px;color:#6a5a48}
.seal{display:inline-flex;align-items:center;justify-content:center;background:#c8402e;color:#fff;border:2px solid #111;border-radius:4px;font-weight:900;font-family:'Noto Serif TC',serif}
.mono .seal{background:#111}
#select{background:#241f1b;overflow-y:auto}
#select h2,.panelTitle{text-align:center;font-family:'Noto Serif TC',serif;font-size:24px;margin:16px 0 4px;letter-spacing:.1em}
.hint{text-align:center;color:var(--ui-dim);font-size:14px;margin:0 12px 10px}
.sects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:8px 16px 24px}
.sect{position:relative;background:var(--card-bg);color:#1a1612;border:3px solid #111;border-radius:8px;box-shadow:4px 4px 0 #000;padding:8px 10px 10px;cursor:pointer;text-align:center}
.sect svg{width:100%;max-width:130px;height:auto}
.sect h3{margin:2px 0;font-family:'Noto Serif TC',serif;font-size:22px}
.sect .role{font-size:13px;color:#7a2a1c;font-weight:700}
.mono .sect .role{color:#111}
.sect p{font-size:13px;line-height:1.5;margin:6px 0 0;text-align:left}
.sect.lock{filter:grayscale(1);opacity:.55;cursor:default}
.sect .lockTag{position:absolute;top:10px;right:-6px;transform:rotate(8deg);padding:2px 8px;font-size:13px}
.sect .stars{color:#c8402e;font-size:13px}
#talk{position:absolute;inset:0;z-index:60;display:none;cursor:pointer}
#talk.on{display:block}
#talk .bgFx{position:absolute;inset:0;opacity:0;transition:opacity .25s;pointer-events:none}
#talk .bgFx.on{opacity:1}
#talk .bgFx svg{width:100%;height:100%}
.tbox{position:absolute;left:10px;right:10px;bottom:10px;min-height:140px;background:var(--ui-panel);border:var(--ui-border) solid var(--ui-line);border-radius:var(--ui-radius);box-shadow:4px 4px 0 #000;padding:14px 14px 14px 128px;max-width:900px;margin:0 auto}
.tbox .por{position:absolute;left:8px;bottom:8px;width:112px;height:112px;background:var(--card-bg);border:3px solid #111;border-radius:6px;overflow:hidden}
.tbox .por svg{width:100%;height:100%}
.tbox .por .noPor{display:flex;align-items:center;justify-content:center;height:100%;font-size:44px;color:#111;font-family:'Noto Serif TC',serif;font-weight:900}
.tbox .nm{position:absolute;top:-17px;left:128px;padding:2px 12px;font-size:16px}
.tbox .tx{font-size:clamp(16px,4.3vw,20px);line-height:1.6;white-space:pre-wrap}
.tbox .nx{position:absolute;right:12px;bottom:6px;font-size:13px;color:var(--ui-dim);animation:blink 1s infinite}
.tbox .skip{position:absolute;right:8px;top:-36px}
@keyframes blink{50%{opacity:.2}}
.narr .tbox{padding-left:16px}.narr .tbox .por,.narr .tbox .nm{display:none}
#map{background:var(--card-bg);color:#1a1612}
#map .mapSvg{flex:1;position:relative}
#map .mapSvg svg{position:absolute;inset:0;width:100%;height:100%}
.mapHud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--ui-panel);color:var(--ui-text);border-top:3px solid #111}
.mapHud .grow{flex:1}
.node{cursor:pointer}
.node.next .ring{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
.hpPill{font-weight:700}
#battle{background:#2a241f}
#stage{position:relative;--sh:clamp(250px,50vh,460px);height:var(--sh);overflow:hidden;border-bottom:3px solid #111}
#stage .bg{position:absolute;inset:0}
#stage .bg svg{width:100%;height:100%}
.fighters{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 2% 64px}
.pbox{position:relative;display:flex;flex-direction:column;align-items:center}
.pbox svg{width:min(33vw,calc(var(--sh) * .56));height:auto;overflow:visible;display:block}
.ebox-wrap{display:flex;align-items:flex-end;justify-content:flex-end;gap:2%;flex:1;min-width:0;margin-left:2%}
.ebox{position:relative;display:flex;flex-direction:column;align-items:center;flex:0 1 auto;min-width:0;cursor:pointer;transition:opacity .4s, transform .2s}
.ebox.boss{flex:0 1 auto}
.ebox svg.fig{width:min(28vw,calc(var(--sh) * .52));max-width:100%;height:auto;overflow:visible;display:block;margin:0 auto}
.ebox-wrap.solo .ebox svg.fig{width:min(36vw,calc(var(--sh) * .56))}
.ebox.boss svg.fig,.ebox-wrap.solo .ebox.boss svg.fig{width:min(48vw,calc(var(--sh) * .68))}
.ebox.sel .fig{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px #e3b341)}
.ebox.dead{opacity:0;pointer-events:none}
.ebox .tgt{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);font-size:12px;padding:1px 6px;display:none}
.ebox.sel .tgt{display:block}
.intent{display:flex;gap:3px;align-items:center;background:rgba(20,17,15,.85);color:#fff;border:2px solid #111;border-radius:6px;padding:2px 6px;font-size:13px;font-weight:700;min-height:26px;margin-bottom:2px;white-space:nowrap}
.intent svg{width:16px;height:16px}
.intent .lb{color:#ffd07a;font-size:12px}
.bars{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max(100%,84px);max-width:170px;margin-top:2px}
.hpbar{position:relative;height:13px;background:#3a302a;border:2px solid #111;border-radius:7px;overflow:hidden}
.hpbar i{position:absolute;inset:0;right:auto;background:linear-gradient(#e2584a,#a72e22);transition:width .3s}
.mono .hpbar i{background:#666}
.hpbar.blk i.b{background:none}
.hpbar span{position:absolute;inset:0;font-size:11px;line-height:10px;text-align:center;color:#fff;font-weight:700;text-shadow:1px 1px 0 #000}
.ename{font-size:13px;font-weight:700;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;white-space:nowrap}
.chips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:18px;margin-top:2px}
.chip{font-size:11px;padding:0 5px;border-radius:9px;background:#3b322b;border:1.5px solid #111;color:#fff;line-height:15px;white-space:nowrap}
.chip.bad{background:#7a2a1c}.chip.good{background:#2f6b4a}.chip.blk{background:#2f6f8f}
.mono .chip.bad,.mono .chip.good,.mono .chip.blk{background:#333}
.stance{position:absolute;top:-2px;right:-4px;width:30px;height:30px;border-radius:50%;border:2.5px solid #111;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:900;font-size:17px;color:#fff;box-shadow:2px 2px 0 #000;z-index:3}
.st-剛{background:#c8402e}.st-快{background:#3f6fa8}.st-柔{background:#3f8a5a}.st-奇{background:#7a3f9e}
.mono .stance{background:#fff!important;color:#111}
.brk{display:flex;gap:2px;justify-content:center;margin-top:2px}
.brk b{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid #111;background:#4a3f37}
.brk b.on{background:#e3b341}
.broken .fig{animation:wobble .5s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.lunge{animation:lunge .35s ease}
@keyframes lunge{40%{transform:translateX(-26%) scale(1.06)}}
.plunge{animation:plunge .3s ease}
@keyframes plunge{40%{transform:translateX(22%) scale(1.05)}}
.hitk{animation:hitk .3s}
@keyframes hitk{30%{transform:translateX(6%);filter:brightness(2.5)}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.dmgN{position:absolute;font-family:'Noto Serif TC',serif;font-weight:900;font-size:28px;color:#fff;-webkit-text-stroke:5px #111;paint-order:stroke fill;animation:dmgUp .9s ease-out forwards;white-space:nowrap}
.dmgN.big{font-size:42px;color:#ffd23f}
.dmgN.heal{color:#7fe08f}.dmgN.blk{color:#9ad7ff}.dmgN.me{color:#ff7b6b}
.dmgN.note{font-size:17px;color:#ffd07a;-webkit-text-stroke:4px #111}
@keyframes dmgUp{0%{transform:translate(-50%,0) scale(1.6)}20%{transform:translate(-50%,-6px) scale(1)}100%{transform:translate(-50%,-50px);opacity:0}}
.sfx{position:absolute;width:150px;height:80px;margin:-40px 0 0 -75px;animation:sfxPop .8s ease-out forwards}
@keyframes sfxPop{0%{transform:scale(2.6) rotate(var(--r,-8deg));opacity:0}15%{transform:scale(.9) rotate(var(--r,-8deg));opacity:1}25%{transform:scale(1) rotate(var(--r,-8deg))}80%{opacity:1}100%{transform:scale(1.1) rotate(var(--r,-8deg));opacity:0}}
.lines{position:absolute;inset:0;opacity:.9;animation:fadeOut .45s forwards}
.lines svg{width:100%;height:100%}
@keyframes fadeOut{to{opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(17,14,12,.88);border-top:3px solid #e3b341;border-bottom:3px solid #e3b341;font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;letter-spacing:.3em;color:#fff;animation:bannerIn 1s ease forwards}
.banner.enemy{border-color:#c8402e}
@keyframes bannerIn{0%{transform:scaleY(0)}15%{transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.bigSeal{position:absolute;left:50%;top:44%;width:150px;height:150px;margin:-75px 0 0 -75px;font-size:100px;border-width:5px;border-radius:12px;box-shadow:5px 5px 0 #000;animation:stampIn .5s ease-out forwards}
@keyframes stampIn{0%{transform:scale(3) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.flash{position:absolute;inset:0;box-shadow:inset 0 0 60px 20px rgba(200,40,30,.7);animation:fadeOut .45s forwards}
.ink{}
.blot{position:absolute;border-radius:50%;background:#111;animation:blot .7s ease-out forwards}
@keyframes blot{0%{transform:scale(.1)}30%{transform:scale(1.15)}100%{transform:scale(1);opacity:0}}
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ui-panel);border-bottom:2px solid #000;flex-wrap:wrap}
.hud .pHp{flex:1 1 140px;min-width:120px}

<div id="app" class="theme">
